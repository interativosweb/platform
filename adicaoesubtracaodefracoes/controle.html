<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Controle do Site</title>
  <style>
    :root{
      --bg1:#0b1220;
      --bg2:#0f172a;
      --card:#0b1b34;
      --card2:#0f2448;
      --text:#e5e7eb;
      --muted:#a7b0c0;
      --stroke:rgba(255,255,255,.10);
      --shadow:0 18px 60px rgba(0,0,0,.55);
      --radius:18px;
      --red:#ef4444;
      --green:#22c55e;
      --blue:#3b82f6;
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(900px 500px at 20% 10%, rgba(59,130,246,.22), transparent 60%),
        radial-gradient(900px 500px at 80% 20%, rgba(34,197,94,.18), transparent 60%),
        radial-gradient(900px 500px at 40% 90%, rgba(239,68,68,.16), transparent 60%),
        linear-gradient(180deg, var(--bg1), var(--bg2));
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
    }
    .modal{
      width:min(560px, 100%);
      border-radius:var(--radius);
      background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      border:1px solid var(--stroke);
      box-shadow:var(--shadow);
      overflow:hidden;
      backdrop-filter: blur(10px);
    }
    .content{ padding:22px; background:linear-gradient(180deg, rgba(15,36,72,.55), rgba(11,27,52,.55)); }
    h1{ margin:0 0 6px 0; font-size:20px; }
    .sub{ margin:0 0 14px 0; color:var(--muted); font-size:13px; line-height:1.35; }

    .badge{
      display:inline-flex; align-items:center; gap:10px;
      padding:8px 10px; border-radius:999px;
      border:1px solid var(--stroke);
      background:rgba(255,255,255,.06);
      font-weight:800; font-size:12px;
      margin-bottom:14px;
    }
    .dot{ width:10px; height:10px; border-radius:50%; background:var(--green); box-shadow:0 0 0 4px rgba(34,197,94,.14); }

    .field{ margin:10px 0 14px 0; }
    .label{ font-size:12px; color:var(--muted); margin-bottom:8px; display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .inputWrap{ display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:14px; border:1px solid var(--stroke); background:rgba(255,255,255,.05); }
    input{ flex:1; border:0; outline:none; background:transparent; color:var(--text); font-size:15px; }
    .miniBtn{ border:1px solid var(--stroke); background:rgba(255,255,255,.06); color:var(--text); padding:8px 10px; border-radius:12px; cursor:pointer; font-weight:800; font-size:12px; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .btn{
      flex:1; min-width:180px;
      border:0; cursor:pointer;
      padding:12px 14px;
      border-radius:16px;
      font-weight:900; font-size:14px;
      color:white;
      box-shadow:0 10px 28px rgba(0,0,0,.30);
      transition:transform .12s ease, filter .12s ease;
    }
    .btn:hover{ transform:translateY(-1px); filter:brightness(1.03); }
    .btn:active{ transform:translateY(0); filter:brightness(.98); }
    .btn-red{ background:linear-gradient(180deg, rgba(239,68,68,.98), rgba(220,38,38,.98)); }
    .btn-green{ background:linear-gradient(180deg, rgba(34,197,94,.98), rgba(22,163,74,.98)); }
    .btn-blue{ background:linear-gradient(180deg, rgba(59,130,246,.95), rgba(37,99,235,.95)); }

    .footer{ padding:14px 22px 18px 22px; border-top:1px solid rgba(255,255,255,.08); background:rgba(0,0,0,.10); }
    .hint{ font-size:12px; color:var(--muted); line-height:1.45; }

    .toast{
      position:fixed;
      left:50%; bottom:18px;
      transform:translateX(-50%);
      background:rgba(15,23,42,.92);
      border:1px solid rgba(255,255,255,.10);
      color:var(--text);
      padding:10px 12px;
      border-radius:14px;
      box-shadow:0 14px 40px rgba(0,0,0,.45);
      font-size:13px;
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      max-width:min(560px, calc(100% - 24px));
    }
    .toast.show{ opacity:1; transform:translateX(-50%) translateY(-2px); }

    @media (max-width:420px){
      .btn{ min-width:100%; }
    }
  </style>
</head>
<body>

  <div class="modal" role="dialog" aria-modal="true">
    <div class="content">
      <h1>Controle do Site</h1>
      <p class="sub">Quando você quiser, bloqueie ou libere o acesso. Senha: <b>9141</b></p>

      <div class="badge">
        <span class="dot" id="dot"></span>
        <span id="statusText">Carregando...</span>
      </div>

      <div class="field">
        <div class="label">
          <span>Senha do controle</span>
          <span id="nextInfo"></span>
        </div>
        <div class="inputWrap">
          <input id="senha" type="password" placeholder="Digite a senha" autocomplete="current-password" />
          <button class="miniBtn" id="toggleView" type="button">Mostrar</button>
        </div>
      </div>

      <div class="row">
        <button class="btn btn-red" type="button" onclick="bloquear()">🔒 Bloquear site</button>
        <button class="btn btn-green" type="button" onclick="desbloquear()">🔓 Desbloquear</button>
      </div>

      <div class="row" style="margin-top:10px;">
        <button class="btn btn-blue" type="button" onclick="limparEstado()">🧹 Limpar estado</button>
      </div>
    </div>

    <div class="footer">
      <div class="hint">
        <b>Importante:</b> para as páginas realmente bloquearem, elas precisam ter o arquivo <b>auth.js</b> incluído.
        (Eu já deixei isso pronto no zip que vou te mandar.)
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const SENHA = "9141";
    const KEY = "site_bloqueado";

    const statusText = document.getElementById('statusText');
    const dot = document.getElementById('dot');
    const senhaEl = document.getElementById('senha');
    const toastEl = document.getElementById('toast');
    const nextInfo = document.getElementById('nextInfo');

    const params = new URLSearchParams(location.search);
    const nextParam = params.get('next');
    const nextStored = (() => { try { return sessionStorage.getItem('controle_next'); } catch(e) { return null; } })();
    const nextUrl = nextParam || nextStored;

    if (nextUrl) {
      nextInfo.textContent = 'Quer voltar para a página anterior depois de desbloquear.';
    }

    function isBloqueado(){
      return localStorage.getItem(KEY) === 'true';
    }

    function setBloqueado(v){
      localStorage.setItem(KEY, v ? 'true' : 'false');
    }

    function atualizar(){
      if(isBloqueado()){
        statusText.textContent = 'STATUS: BLOQUEADO';
        dot.style.background = 'var(--red)';
        dot.style.boxShadow = '0 0 0 4px rgba(239,68,68,.14)';
      } else {
        statusText.textContent = 'STATUS: LIBERADO';
        dot.style.background = 'var(--green)';
        dot.style.boxShadow = '0 0 0 4px rgba(34,197,94,.14)';
      }
    }

    function toast(msg){
      toastEl.innerHTML = msg;
      toastEl.classList.add('show');
      clearTimeout(window.__t);
      window.__t = setTimeout(()=> toastEl.classList.remove('show'), 2200);
    }

    function validarSenha(){
      if ((senhaEl.value || '').trim() !== SENHA) {
        toast('❌ <b>Senha incorreta</b>');
        senhaEl.focus();
        return false;
      }
      return true;
    }

    function bloquear(){
      if(!validarSenha()) return;
      setBloqueado(true);
      atualizar();
      toast('🔒 <b>Site bloqueado</b>');
      senhaEl.value = '';
    }

    function desbloquear(){
      if(!validarSenha()) return;
      setBloqueado(false);
      atualizar();
      toast('🔓 <b>Site liberado</b>');

      try { sessionStorage.removeItem('controle_next'); } catch(e) {}

      const go = nextUrl;
      senhaEl.value = '';
      if (go) {
        setTimeout(()=> { location.href = go; }, 400);
      }
    }

    function limparEstado(){
      localStorage.removeItem(KEY);
      atualizar();
      toast('🧹 <b>Estado limpo</b> (liberado por padrão)');
      senhaEl.value = '';
    }

    document.getElementById('toggleView').addEventListener('click', () => {
      const isPass = senhaEl.type === 'password';
      senhaEl.type = isPass ? 'text' : 'password';
      document.getElementById('toggleView').textContent = isPass ? 'Ocultar' : 'Mostrar';
      senhaEl.focus();
    });

    atualizar();
  </script>
</body>
</html>
