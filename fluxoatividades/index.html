<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade — AlquiLab</title>
<style>
:root{--bg:#f5f5f7;--text:#1d1d1f;--text2:#86868b;--accent:#0071e3;--success:#34c759;--error:#ff3b30;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
html,body{min-height:100vh}
body{
  background:#fafafa;
  background-image:
    linear-gradient(rgba(0,0,0,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,0,0,.045) 1px,transparent 1px),
    radial-gradient(circle,rgba(0,0,0,.08) 1.3px,transparent 1.3px);
  background-size:60px 60px,60px 60px,60px 60px;
  background-position:0 0,0 0,30px 30px;
  color:var(--text);
  display:flex;flex-direction:column;align-items:center;
  padding:24px 18px 80px;
  -webkit-user-select:none;user-select:none;
}
@media print{html,body{display:none!important}}

.container{width:100%;max-width:1100px}

.header-bar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.badge{padding:7px 18px;border-radius:50px;font-size:.82rem;font-weight:600;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge-name,.badge-serie{background:#aeb0b5}
.badge-score{background:var(--success)}
.badge-error{background:var(--error)}

.progress-wrap{width:100%;max-width:60%;margin:0 auto 22px;height:8px;background:#e5e5ea;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--success);transition:width .4s ease}

.q-card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 14px rgba(0,0,0,.07);padding:26px;margin-bottom:20px}
.q-step{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:14px}

.q-split{display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:start}
.q-split.no-img{grid-template-columns:1fr}
.q-img-wrap{display:flex;justify-content:center;align-items:flex-start}
.q-img{max-width:100%;max-height:520px;display:block;border-radius:8px}
.q-right{display:flex;flex-direction:column;gap:14px}
.q-text{font-size:1.1rem;line-height:1.5}
.q-text b{font-weight:700}

.opts{display:flex;flex-direction:column;gap:10px}
.btn-opt{padding:13px 16px;border:1px solid #d2d2d7;border-radius:12px;font-size:1rem;background:#fff;cursor:pointer;text-align:left;transition:all .15s;font-weight:500}
.btn-opt:hover:not(:disabled){background:var(--success);color:#fff;border-color:var(--success);transform:translateY(-1px)}
.btn-opt:disabled{cursor:default}
.btn-opt.certo{border-color:var(--success);color:var(--success);background:rgba(52,199,89,.08)}
.btn-opt.errado{border-color:var(--error);color:var(--error);background:rgba(255,59,48,.08)}

.q-textarea{width:100%;padding:13px;border:1px solid #d2d2d7;border-radius:12px;font-size:1rem;font-family:inherit;resize:vertical;min-height:110px;outline:none}
.q-textarea:focus{border-color:var(--accent)}
.btn-enviar{padding:13px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:background .15s}
.btn-enviar:hover{background:#005bb5}
.btn-enviar:disabled{background:#c7c7cc;cursor:not-allowed}

.resolucao{margin-top:18px;padding:16px;border-radius:12px;background:rgba(0,113,227,.06);border-left:4px solid var(--accent);font-size:.95rem;line-height:1.55}
.resolucao .rt{font-weight:700;margin-bottom:4px;color:var(--accent);font-size:.78rem;text-transform:uppercase;letter-spacing:1px}

.feedback{display:none;margin-top:14px;padding:14px;border-radius:12px;font-size:.95rem;line-height:1.5}
.feedback.show{display:block}
.feedback.acerto{background:rgba(52,199,89,.1);border-left:4px solid var(--success);color:#1b5e20}
.feedback.erro{background:rgba(255,59,48,.1);border-left:4px solid var(--error);color:#7a1e18}
.feedback.diss{background:rgba(0,113,227,.08);border-left:4px solid var(--accent)}

.btn-next{padding:13px;border:none;border-radius:12px;background:var(--success);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:14px;display:none;transition:background .15s;width:100%}
.btn-next:hover{background:#2da84e}

.end-screen{text-align:center;padding:40px 20px;background:#fff;border-radius:var(--radius);box-shadow:0 2px 14px rgba(0,0,0,.07)}
.end-screen h1{font-size:1.8rem;margin-bottom:10px;color:var(--success)}
.end-screen .big-name{font-size:2.2rem;font-weight:800;color:var(--accent);margin:10px 0}
.end-screen .stats{display:flex;justify-content:center;gap:40px;margin-top:20px}
.end-screen .stat-val{font-size:2rem;font-weight:700}
.end-screen .stat-label{font-size:.8rem;color:var(--text2)}

/* Timer footer */
.timer-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:500;
  background:rgba(255,255,255,.96);backdrop-filter:blur(12px);
  border-top:1px solid #e5e5ea;
  padding:12px 20px;display:none;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 -4px 20px rgba(0,0,0,.06);
}
.timer-footer.show{display:flex}
.timer-label{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text2)}
.timer-val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.timer-val.warn{color:#ff9500}
.timer-val.danger{color:var(--error)}
.timer-bar{width:220px;height:6px;background:#e5e5ea;border-radius:4px;overflow:hidden}
.timer-bar>div{height:100%;width:100%;background:var(--success);transition:width .5s linear,background .3s}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:9000;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#fff;padding:26px;border-radius:16px;width:100%;max-width:420px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal h2{font-size:1.2rem;margin-bottom:6px}
.modal p{font-size:.85rem;color:var(--text2);margin-bottom:16px}
.modal input{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:10px;font-size:1rem;text-align:center;outline:none;margin-bottom:8px;font-family:inherit}
.modal input:focus{border-color:var(--accent)}
.aviso{color:var(--error);font-size:.78rem;font-weight:600;min-height:1em;margin:4px 0}
.btn-entrar{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:6px}

/* Prova lock overlay (student side) */
.lock-overlay{position:fixed;inset:0;z-index:9999;background:rgba(7,7,12,.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:20px}
.lock-overlay.show{display:flex}
.lock-popup{background:rgba(18,18,28,.94);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:32px;max-width:440px;width:100%;text-align:center;color:#f4f4f8}
.lock-popup .lbadge{display:inline-block;padding:5px 14px;border-radius:50px;background:rgba(255,45,111,.15);border:1px solid rgba(255,45,111,.45);color:#ff2d6f;font-size:.66rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.lock-popup h1{font-size:1.5rem;margin-bottom:10px}
.lock-popup .vio{color:#ff2d6f;font-weight:600;font-size:.88rem;margin-bottom:14px;padding:8px 12px;border-radius:8px;background:rgba(255,45,111,.1);border:1px solid rgba(255,45,111,.3)}
.lock-popup .sub{color:#8a8aa0;font-size:.86rem;margin-bottom:18px;line-height:1.5}
.lock-popup input{width:100%;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:1rem;outline:none;margin-bottom:10px;font-family:inherit}
.lock-popup input:focus{border-color:#ff2d6f}
.lock-popup .err{color:#ff2d6f;font-size:.8rem;min-height:1em;margin-bottom:8px}
.lock-popup button{width:100%;padding:13px;background:linear-gradient(135deg,#ff2d6f,#b14bff);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit}

.loading{text-align:center;padding:60px;color:var(--text2);font-size:1rem}

@media(max-width:720px){
  .q-split{grid-template-columns:1fr}
  .progress-wrap{max-width:85%}
}
</style>
</head>
<body>

<div class="container">
  <div class="header-bar" id="headerBar" style="display:none">
    <div class="badge badge-name" id="badgeNome">Aluno</div>
    <div class="badge badge-serie" id="badgeSerie">Série</div>
    <div class="badge badge-score" id="badgeAcertos">0 acertos</div>
    <div class="badge badge-error" id="badgeErros">0 erros</div>
  </div>

  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="questionArea"></div>

  <div id="loadingMsg" class="loading">Carregando atividade...</div>
</div>

<!-- Timer footer -->
<div class="timer-footer" id="timerFooter">
  <div class="timer-label">Tempo</div>
  <div class="timer-val" id="timerVal">00:00</div>
  <div class="timer-bar"><div id="timerBar"></div></div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
  <div class="modal">
    <h2>Identificação</h2>
    <p>Digite seu nome para entrar na atividade.</p>
    <div id="turmaInfo" style="background:#f3f4f6;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;color:#374151;line-height:1.5"></div>
    <input type="text" id="inputNome" placeholder="Qual o seu nome?" maxlength="15">
    <div class="aviso" id="loginAviso"></div>
    <button class="btn-entrar" onclick="realizarLogin()">Entrar</button>
  </div>
</div>

<!-- Prova Lock -->
<div id="lockOverlay" class="lock-overlay">
  <div class="lock-popup">
    <div class="lbadge">Tela Bloqueada</div>
    <h1>Acesso Suspenso</h1>
    <div class="vio" id="violationMsg">Violação detectada</div>
    <div class="sub">Peça ao professor para inserir a senha de desbloqueio.</div>
    <input id="senhaInput" type="password" placeholder="Senha do professor" autocomplete="off">
    <div class="err" id="errMsg"></div>
    <button id="btnDesbloquear">Desbloquear</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyAAHGPjuRvE9VpHR469A5RbSEUzxl1zq2w",authDomain:"profbase-5f9b0.firebaseapp.com",databaseURL:"https://profbase-5f9b0-default-rtdb.firebaseio.com",projectId:"profbase-5f9b0",storageBucket:"profbase-5f9b0.firebasestorage.app",messagingSenderId:"826412057766",appId:"1:826412057766:web:729e6e24ce7587417fe067"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

const urlParams=new URLSearchParams(location.search);
const turmaId=urlParams.get('turmaId')||'';
const basePath=turmaId?'turmas_fluxo/'+turmaId+'/':'';

let alunoId=localStorage.getItem('fluxo_firebaseId');
let alunoNome='',alunoSerie='',turmaInfo=null;
let fluxoData=null,atividadeId=null,flowOwnerId=null;
let nodeAtual=null,fluxoPercorrido=[],respostas={};
let acertos=0,erros=0,totalNodes=0,answered=false;
let provaActive=false,locked=false;
let timerInterval=null,timerSec=0,timerMax=0;
let currentShuffleMap=null; // for MC: displayIdx -> originalIdx

async function init(){
  if(!turmaId){$('loadingMsg').textContent='Link inválido. Peça um novo link ao professor.';return}
  try{
    const snap=await db.ref('turmas_fluxo/'+turmaId).once('value');
    if(!snap.exists()){$('loadingMsg').textContent='Turma não encontrada.';return}
    const turma=snap.val();
    turmaInfo=turma;atividadeId=turma.atividadeId;flowOwnerId=turma.criadoPor;
    if(!atividadeId){$('loadingMsg').textContent='Nenhuma atividade conectada.';return}
    alunoSerie=((turma.serie||'')+' '+(turma.turma||'')).trim();
    const ti=$('turmaInfo');
    if(ti) ti.innerHTML='<b>'+esc(turma.escola||'Escola')+'</b><br>'+esc(turma.serie||'')+(turma.turma?' · Turma '+esc(turma.turma):'');
  }catch(e){console.error(e);$('loadingMsg').textContent='Erro ao carregar turma.';return}

  try{
    const snap=await db.ref('fluxos/'+flowOwnerId+'/'+atividadeId).once('value');
    if(!snap.exists()){$('loadingMsg').textContent='Atividade não encontrada.';return}
    fluxoData=snap.val();
  }catch(e){console.error(e);$('loadingMsg').textContent='Erro ao carregar atividade.';return}

  if(fluxoData.nodes) totalNodes=Object.values(fluxoData.nodes).filter(n=>n.tipo==='multipla_escolha'||n.tipo==='dissertativa').length;

  $('loadingMsg').style.display='none';

  const savedNome=localStorage.getItem('fluxo_nome');
  if(savedNome){
    alunoNome=savedNome;
    await syncStudent();
    maybeActivateProva();
    startFlow();
  }else{
    $('loginModal').classList.add('show');
    setTimeout(()=>$('inputNome').focus(),100);
  }
}

window.realizarLogin=async function(){
  const nome=$('inputNome').value.trim();
  if(!nome){$('loginAviso').textContent='Digite seu nome.';return}
  if(nome.includes(' ')){$('loginAviso').textContent='Apenas o primeiro nome.';return}
  if(nome.length>15){$('loginAviso').textContent='Máximo 15 letras.';return}
  alunoNome=nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase();
  if(!alunoSerie) alunoSerie='—';
  localStorage.setItem('fluxo_nome',alunoNome);
  localStorage.setItem('fluxo_serie',alunoSerie);
  if(!alunoId){const newRef=db.ref(basePath+'alunos').push();alunoId=newRef.key;localStorage.setItem('fluxo_firebaseId',alunoId)}
  await db.ref(basePath+'alunos/'+alunoId).update({
    nome:alunoNome,serie:alunoSerie,entrouEm:new Date().toISOString(),
    status:'online',acertos:0,erros:0,fluxoPercorrido:[],respostas:{}
  });
  $('loginModal').classList.remove('show');
  maybeActivateProva();
  startFlow();
};

async function syncStudent(){
  if(!alunoId){const newRef=db.ref(basePath+'alunos').push();alunoId=newRef.key;localStorage.setItem('fluxo_firebaseId',alunoId)}
  await db.ref(basePath+'alunos/'+alunoId).update({
    nome:alunoNome,serie:alunoSerie,entrouEm:new Date().toISOString(),
    status:'online',ultimoAcesso:new Date().toISOString()
  });
  try{
    const snap=await db.ref(basePath+'alunos/'+alunoId).once('value');
    if(snap.exists()){
      const d=snap.val();
      acertos=d.acertos||0;erros=d.erros||0;
      fluxoPercorrido=d.fluxoPercorrido||[];respostas=d.respostas||{};
    }
  }catch(e){}
}

/* ── PROVA MODE ── */
function maybeActivateProva(){
  if(!fluxoData||!fluxoData.provaMode) return;
  provaActive=true;
  try{document.documentElement.requestFullscreen()}catch(e){}
  installProvaHandlers();
}

function installProvaHandlers(){
  const blockedKeys=new Set(['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12']);
  document.addEventListener('keydown',e=>{
    if(!provaActive||locked) return;
    const tag=(e.target&&e.target.tagName)||'';
    const inInput=tag==='INPUT'||tag==='TEXTAREA';
    const k=e.key;
    if(blockedKeys.has(k)){e.preventDefault();e.stopPropagation();lock('Tecla bloqueada: '+k);return}
    if(k==='Escape'){e.preventDefault();e.stopPropagation();lock('Tentou sair da tela cheia');return}
    if(e.ctrlKey||e.metaKey){
      const low=(k||'').toLowerCase();
      if(inInput&&['c','v','x','a'].includes(low))return;
      if(['c','v','x','p','s','r','u','a','t','n','w'].includes(low)||(e.shiftKey&&['i','j','c'].includes(low))){
        e.preventDefault();e.stopPropagation();lock('Atalho bloqueado: Ctrl+'+k.toUpperCase());return;
      }
    }
  },true);
  document.addEventListener('contextmenu',e=>{if(provaActive){e.preventDefault();lock('Menu de contexto bloqueado')}});
  document.addEventListener('fullscreenchange',()=>{if(provaActive&&!document.fullscreenElement)lock('Saiu da tela cheia')});
  document.addEventListener('visibilitychange',()=>{if(provaActive&&document.hidden)lock('Trocou de aba')});
  window.addEventListener('blur',()=>{if(provaActive)setTimeout(()=>{if(!document.hasFocus())lock('Perdeu o foco da janela')},100)});
  window.addEventListener('beforeunload',e=>{if(provaActive){e.preventDefault();e.returnValue=''}});
}

function lock(reason){
  if(locked)return;locked=true;
  $('violationMsg').textContent=reason||'Violação detectada';
  $('errMsg').textContent='';$('senhaInput').value='';
  $('lockOverlay').classList.add('show');
  setTimeout(()=>$('senhaInput').focus(),60);
}
document.addEventListener('DOMContentLoaded',()=>{
  const bd=$('btnDesbloquear'),si=$('senhaInput');
  if(bd) bd.onclick=tryUnlock;
  if(si) si.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryUnlock()}});
});
async function tryUnlock(){
  const v=$('senhaInput').value;
  if(fluxoData&&fluxoData.provaMode&&v===fluxoData.provaMode.senha){
    locked=false;
    $('lockOverlay').classList.remove('show');
    try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}
  }else{
    $('errMsg').textContent='Senha incorreta.';$('senhaInput').value='';$('senhaInput').focus();
  }
}

/* ── FLOW ── */
function startFlow(){
  $('headerBar').style.display='flex';
  $('progressWrap').style.display='block';
  updateBadges();
  const startNode=Object.values(fluxoData.nodes).find(n=>n.tipo==='inicio');
  if(!startNode){$('questionArea').innerHTML='<div class="loading">Fluxo sem nó de início.</div>';return}
  if(fluxoPercorrido.length>0){
    const lastId=fluxoPercorrido[fluxoPercorrido.length-1];
    const lastNode=fluxoData.nodes[lastId];
    if(lastNode&&lastNode.tipo!=='fim'){
      if(respostas[lastId]){
        const nextId=getNextNode(lastId,respostas[lastId]);
        nodeAtual=(nextId&&fluxoData.nodes[nextId])?nextId:lastId;
      }else nodeAtual=lastId;
    }else if(lastNode&&lastNode.tipo==='fim'){showEndScreen();return}
    else nodeAtual=getFirstQuestion(startNode);
  }else nodeAtual=getFirstQuestion(startNode);
  if(!nodeAtual){showEndScreen();return}
  if(!fluxoPercorrido.includes(nodeAtual)){fluxoPercorrido.push(nodeAtual);saveProgress()}
  renderQuestion();
}

function getFirstQuestion(sn){return sn.conexoes&&sn.conexoes.proximo?sn.conexoes.proximo:null}
function getNextNode(id,resp){
  const n=fluxoData.nodes[id];if(!n||!n.conexoes)return null;
  if(n.tipo==='multipla_escolha')return resp&&resp.acertou?n.conexoes.acerto:n.conexoes.erro;
  if(n.tipo==='dissertativa')return n.conexoes.concluido;
  if(n.tipo==='inicio')return n.conexoes.proximo;
  return null;
}

function modifiersOf(nodeId){
  const mods=[];
  if(!fluxoData.nodes) return mods;
  Object.values(fluxoData.nodes).forEach(m=>{
    if((m.tipo==='mod_tempo'||m.tipo==='mod_shuffle'||m.tipo==='mod_embaralhar')&&m.attachedTo===nodeId) mods.push(m);
  });
  return mods;
}

function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ── RENDER ── */
function renderQuestion(){
  stopTimer();
  currentShuffleMap=null;
  const node=fluxoData.nodes[nodeAtual];
  if(!node){showEndScreen();return}
  if(node.tipo==='fim'){showEndScreen();return}

  answered=false;
  updateProgress();

  const area=$('questionArea');
  const stepNum=fluxoPercorrido.filter(id=>{const n=fluxoData.nodes[id];return n&&(n.tipo==='multipla_escolha'||n.tipo==='dissertativa')}).length;

  const mods=modifiersOf(nodeAtual);
  const hasShuffle=mods.some(m=>m.tipo==='mod_shuffle'||m.tipo==='mod_embaralhar'||m.kind==='embaralhar');
  const tempoMod=mods.find(m=>m.tipo==='mod_tempo'||m.kind==='tempo');

  const imgSrc=node.imgData||node.imgUrl||'';
  const hasImg=!!imgSrc;

  let html=`<div class="q-card">`;
  html+=`<div class="q-step">Questão ${stepNum} de ${totalNodes}</div>`;
  html+=`<div class="q-split${hasImg?'':' no-img'}">`;

  if(hasImg){
    html+=`<div class="q-img-wrap"><img class="q-img" src="${node.imgData?imgSrc:esc(imgSrc)}" alt="Imagem"></div>`;
  }

  html+=`<div class="q-right">`;
  if(node.pergunta) html+=`<div class="q-text">${esc(node.pergunta)}</div>`;

  if(node.tipo==='multipla_escolha'){
    let opcoes=(node.opcoes||[]).map((t,i)=>({t,orig:i}));
    if(hasShuffle&&!respostas[nodeAtual]) opcoes=shuffleArray(opcoes.slice());
    else if(respostas[nodeAtual]&&respostas[nodeAtual].shuffleMap){
      opcoes=respostas[nodeAtual].shuffleMap.map(origIdx=>({t:node.opcoes[origIdx],orig:origIdx}));
    }
    currentShuffleMap=opcoes.map(o=>o.orig);
    html+=`<div class="opts" id="optsContainer">`;
    opcoes.forEach((o,i)=>{html+=`<button class="btn-opt" data-display="${i}" data-orig="${o.orig}" onclick="responderMC(${i})">${esc(o.t)}</button>`});
    html+=`</div>`;
  }else if(node.tipo==='dissertativa'){
    html+=`<textarea class="q-textarea" id="respDissertativa" placeholder="Digite sua resposta..."></textarea>`;
    html+=`<button class="btn-enviar" id="btnEnviar" onclick="responderDissertativa()">Enviar Resposta</button>`;
  }

  html+=`</div>`; // q-right
  html+=`</div>`; // q-split

  html+=`<div class="feedback" id="feedback"></div>`;
  html+=`<div id="resolucaoBox"></div>`;
  html+=`<button class="btn-next" id="btnNext" onclick="proximaQuestao()">Próxima Questão</button>`;
  html+=`</div>`;

  area.innerHTML=html;

  if(respostas[nodeAtual]) showSavedAnswer(node,respostas[nodeAtual]);
  else if(tempoMod&&tempoMod.segundos>0) startTimer(tempoMod.segundos);

  window.scrollTo({top:0,behavior:'smooth'});
}

function showResolucao(node){
  if(node.showResolucao&&node.resolucao){
    $('resolucaoBox').innerHTML=`<div class="resolucao"><div class="rt">Resolução</div>${esc(node.resolucao)}</div>`;
  }
}

function showSavedAnswer(node,resp){
  answered=true;
  if(node.tipo==='multipla_escolha'){
    const btns=document.querySelectorAll('.btn-opt');
    btns.forEach(b=>b.disabled=true);
    const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
    btns.forEach(b=>{
      const orig=parseInt(b.dataset.orig);
      const display=parseInt(b.dataset.display);
      if(resp.escolhaDisplay===display){b.classList.add(resp.acertou?'certo':'errado')}
      if(!resp.acertou&&corretas.includes(orig)) b.classList.add('certo');
    });
    const fb=$('feedback');
    fb.className='feedback show '+(resp.acertou?'acerto':'erro');
    fb.innerHTML=`<div style="font-weight:700">${resp.acertou?'Resposta Correta!':'Resposta Incorreta'}</div>`;
  }else if(node.tipo==='dissertativa'){
    const ta=$('respDissertativa');
    if(ta){ta.value=resp.texto||'';ta.disabled=true}
    const btn=$('btnEnviar');if(btn)btn.disabled=true;
    const fb=$('feedback');fb.className='feedback show diss';
    fb.innerHTML='<div style="font-weight:700">Resposta enviada</div>';
  }
  showResolucao(node);
  $('btnNext').style.display='block';
}

window.responderMC=function(displayIdx){
  if(answered) return;
  answered=true;stopTimer();
  const node=fluxoData.nodes[nodeAtual];
  const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
  const origIdx=currentShuffleMap?currentShuffleMap[displayIdx]:displayIdx;
  const acertou=corretas.includes(origIdx);
  if(acertou) acertos++; else erros++;
  respostas[nodeAtual]={tipo:'multipla_escolha',escolhaDisplay:displayIdx,escolhaOriginal:origIdx,acertou,shuffleMap:currentShuffleMap,timestamp:new Date().toISOString()};
  saveProgress();

  const btns=document.querySelectorAll('.btn-opt');
  btns.forEach(b=>b.disabled=true);
  btns[displayIdx].classList.add(acertou?'certo':'errado');
  if(!acertou){
    btns.forEach(b=>{if(corretas.includes(parseInt(b.dataset.orig))) b.classList.add('certo')});
  }
  const fb=$('feedback');
  fb.className='feedback show '+(acertou?'acerto':'erro');
  fb.innerHTML=`<div style="font-weight:700">${acertou?'Resposta Correta!':'Resposta Incorreta'}</div>`;
  showResolucao(node);
  $('btnNext').style.display='block';
  updateBadges();
};

window.responderDissertativa=function(){
  if(answered) return;
  const texto=$('respDissertativa').value.trim();
  if(!texto)return;
  answered=true;stopTimer();
  respostas[nodeAtual]={tipo:'dissertativa',texto,timestamp:new Date().toISOString()};
  saveProgress();
  $('respDissertativa').disabled=true;$('btnEnviar').disabled=true;
  const node=fluxoData.nodes[nodeAtual];
  const fb=$('feedback');fb.className='feedback show diss';
  fb.innerHTML='<div style="font-weight:700">Resposta enviada!</div>';
  showResolucao(node);
  $('btnNext').style.display='block';
};

window.proximaQuestao=function(){
  const nextId=getNextNode(nodeAtual,respostas[nodeAtual]);
  if(!nextId||!fluxoData.nodes[nextId]){showEndScreen();return}
  nodeAtual=nextId;
  if(!fluxoPercorrido.includes(nodeAtual)) fluxoPercorrido.push(nodeAtual);
  saveProgress();renderQuestion();
};

/* ── TIMER ── */
function startTimer(sec){
  timerSec=sec;timerMax=sec;
  $('timerFooter').classList.add('show');
  renderTimer();
  timerInterval=setInterval(()=>{
    timerSec--;
    if(timerSec<=0){stopTimer();timeExpired()}
    else renderTimer();
  },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}$('timerFooter').classList.remove('show')}
function renderTimer(){
  const m=Math.floor(timerSec/60),s=timerSec%60;
  const v=$('timerVal');
  v.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  v.classList.remove('warn','danger');
  const pct=(timerSec/timerMax)*100;
  if(pct<=25) v.classList.add('danger');
  else if(pct<=50) v.classList.add('warn');
  const bar=$('timerBar');
  bar.style.width=pct+'%';
  bar.style.background=pct<=25?'#ff3b30':(pct<=50?'#ff9500':'#34c759');
}
function timeExpired(){
  if(answered)return;
  const node=fluxoData.nodes[nodeAtual];
  if(!node)return;
  if(node.tipo==='multipla_escolha'){
    answered=true;erros++;
    respostas[nodeAtual]={tipo:'multipla_escolha',escolhaDisplay:-1,escolhaOriginal:-1,acertou:false,shuffleMap:currentShuffleMap,expirou:true,timestamp:new Date().toISOString()};
    saveProgress();
    document.querySelectorAll('.btn-opt').forEach(b=>b.disabled=true);
    const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
    document.querySelectorAll('.btn-opt').forEach(b=>{if(corretas.includes(parseInt(b.dataset.orig)))b.classList.add('certo')});
    const fb=$('feedback');fb.className='feedback show erro';
    fb.innerHTML='<div style="font-weight:700">Tempo esgotado</div>';
    showResolucao(node);$('btnNext').style.display='block';updateBadges();
  }else if(node.tipo==='dissertativa'){
    answered=true;
    const texto=($('respDissertativa')||{}).value||'';
    respostas[nodeAtual]={tipo:'dissertativa',texto:texto.trim(),expirou:true,timestamp:new Date().toISOString()};
    saveProgress();
    if($('respDissertativa'))$('respDissertativa').disabled=true;
    if($('btnEnviar'))$('btnEnviar').disabled=true;
    const fb=$('feedback');fb.className='feedback show erro';
    fb.innerHTML='<div style="font-weight:700">Tempo esgotado</div>';
    showResolucao(node);$('btnNext').style.display='block';
  }
}

/* ── END ── */
function showEndScreen(){
  stopTimer();
  $('progressFill').style.width='100%';
  $('questionArea').innerHTML=`
    <div class="end-screen">
      <h1>Atividade Concluída!</h1>
      <div class="big-name">${esc(alunoNome)}</div>
      <p style="color:var(--text2)">Parabéns por completar o percurso!</p>
      <div class="stats">
        <div><div class="stat-val" style="color:var(--success)">${acertos}</div><div class="stat-label">Acertos</div></div>
        <div><div class="stat-val" style="color:var(--error)">${erros}</div><div class="stat-label">Erros</div></div>
      </div>
    </div>`;
  saveProgress();
  if(provaActive){provaActive=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
}

function saveProgress(){
  if(!alunoId)return;
  db.ref(basePath+'alunos/'+alunoId).update({
    acertos,erros,fluxoPercorrido,respostas,nodeAtual,
    ultimoAcesso:new Date().toISOString()
  });
}
function updateBadges(){
  $('badgeNome').textContent=alunoNome;
  $('badgeSerie').textContent=alunoSerie;
  $('badgeAcertos').textContent=acertos+' acertos';
  $('badgeErros').textContent=erros+' erros';
}
function updateProgress(){
  const n=Object.keys(respostas).length;
  const pct=totalNodes>0?Math.min(100,(n/totalNodes)*100):0;
  $('progressFill').style.width=pct+'%';
}

init();
</script>
</body>
</html>
