<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade — AlquiLab</title>
<style>
:root{--bg:#f5f5f7;--text:#1d1d1f;--text2:#86868b;--accent:#0071e3;--success:#34c759;--error:#ff3b30;--radius:14px}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:30px 20px;-webkit-user-select:none;user-select:none}
@media print{html,body{display:none!important}}

.container{width:100%;max-width:700px}

/* Header */
.header-bar{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.badge{padding:8px 20px;border-radius:50px;font-size:.85rem;font-weight:600;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.badge-name{background:#aeb0b5}
.badge-serie{background:#aeb0b5}
.badge-score{background:var(--success)}
.badge-error{background:var(--error)}

/* Progress */
.progress-wrap{width:100%;max-width:60%;margin:0 auto 28px;height:8px;background:#e5e5ea;border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--success);transition:width .4s ease}

/* Question card */
.q-card{background:#fff;border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,.06);padding:28px;margin-bottom:20px}
.q-card .q-step{font-size:.72rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:12px}
.q-card .q-img{max-width:100%;max-height:400px;border-radius:10px;display:block;margin:0 auto 18px;object-fit:contain}
.q-card .q-text{font-size:1.2rem;line-height:1.6;margin-bottom:20px}
.q-card .q-text b{font-weight:700}

/* Options */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.btn-opt{padding:14px;border:1px solid #d2d2d7;border-radius:var(--radius);font-size:1rem;background:#fff;cursor:pointer;text-align:center;transition:all .15s;font-weight:500}
.btn-opt:hover:not(:disabled){background:var(--success);color:#fff;border-color:var(--success);transform:translateY(-2px)}
.btn-opt:disabled{cursor:default}
.btn-opt.certo{border-color:var(--success);color:var(--success);background:rgba(52,199,89,.08)}
.btn-opt.errado{border-color:var(--error);color:var(--error);background:rgba(255,59,48,.08)}

/* Dissertativa */
.q-textarea{width:100%;padding:14px;border:1px solid #d2d2d7;border-radius:var(--radius);font-size:1rem;font-family:inherit;resize:vertical;min-height:100px;outline:none}
.q-textarea:focus{border-color:var(--accent)}
.btn-enviar{width:100%;padding:14px;border:none;border-radius:var(--radius);background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:10px;transition:background .15s}
.btn-enviar:hover{background:#005bb5}
.btn-enviar:disabled{background:#c7c7cc;cursor:not-allowed}

/* Feedback */
.feedback{display:none;margin-top:16px;padding:16px;border-radius:var(--radius);font-size:.95rem;line-height:1.5}
.feedback.show{display:block}
.feedback.acerto{background:rgba(52,199,89,.08);border-left:4px solid var(--success)}
.feedback.erro{background:rgba(255,59,48,.08);border-left:4px solid var(--error)}
.feedback.dissertativa{background:rgba(0,113,227,.06);border-left:4px solid var(--accent)}
.feedback .fb-title{font-weight:700;margin-bottom:4px}

/* Next button */
.btn-next{width:100%;padding:14px;border:none;border-radius:var(--radius);background:var(--success);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:12px;display:none;transition:background .15s}
.btn-next:hover{background:#2da84e}

/* End screen */
.end-screen{text-align:center;padding:40px 20px}
.end-screen h1{font-size:1.8rem;margin-bottom:10px;color:var(--success)}
.end-screen .big-name{font-size:2.4rem;font-weight:800;color:var(--accent);margin:10px 0}
.end-screen .stats{display:flex;justify-content:center;gap:40px;margin-top:20px}
.end-screen .stat-val{font-size:2rem;font-weight:700}
.end-screen .stat-label{font-size:.8rem;color:var(--text2)}

/* Modal login */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:9000}
.modal-overlay.show{display:flex}
.modal{background:#fff;padding:28px;border-radius:16px;width:90%;max-width:420px;text-align:center;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.modal h2{font-size:1.2rem;margin-bottom:6px}
.modal p{font-size:.85rem;color:var(--text2);margin-bottom:16px}
.modal input[type=text]{width:100%;padding:12px;border:1px solid #d2d2d7;border-radius:10px;font-size:1rem;text-align:center;outline:none;margin-bottom:8px}
.modal input[type=text]:focus{border-color:var(--accent)}
.modal .subtitle{font-size:.75rem;font-weight:600;text-transform:uppercase;color:var(--text2);letter-spacing:.5px;margin:12px 0 6px}
.grupo-sel{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.grupo-sel input[type=radio]{display:none}
.grupo-sel label span{display:inline-block;padding:8px 14px;border:1px solid #d2d2d7;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem;transition:all .2s}
.grupo-sel input[type=radio]:checked+span{background:var(--accent);color:#fff;border-color:var(--accent)}
.aviso{color:var(--error);font-size:.78rem;font-weight:600;min-height:1em;margin:4px 0}
.btn-entrar{width:100%;padding:14px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:8px}

/* Loading */
.loading{text-align:center;padding:60px;color:var(--text2);font-size:1rem}

@media(max-width:500px){.opts{grid-template-columns:1fr}.progress-wrap{max-width:85%}}
</style>
</head>
<body>

<div class="container">
  <!-- Header badges -->
  <div class="header-bar" id="headerBar" style="display:none">
    <div class="badge badge-name" id="badgeNome">Aluno</div>
    <div class="badge badge-serie" id="badgeSerie">Série</div>
    <div class="badge badge-score" id="badgeAcertos">0 acertos</div>
    <div class="badge badge-error" id="badgeErros">0 erros</div>
  </div>

  <!-- Progress bar -->
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Question area -->
  <div id="questionArea"></div>

  <!-- Loading -->
  <div id="loadingMsg" class="loading">Carregando atividade...</div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
  <div class="modal">
    <h2>Identificação</h2>
    <p>Insira seus dados para começar.</p>
    <input type="text" id="inputNome" placeholder="Qual o seu nome?" maxlength="15">
    <div class="subtitle">Qual seu ano?</div>
    <div class="grupo-sel" id="selAno">
      <label><input type="radio" name="ano" value="5º Ano"><span>5º</span></label>
      <label><input type="radio" name="ano" value="6º Ano"><span>6º</span></label>
      <label><input type="radio" name="ano" value="7º Ano"><span>7º</span></label>
      <label><input type="radio" name="ano" value="8º Ano"><span>8º</span></label>
      <label><input type="radio" name="ano" value="9º Ano"><span>9º</span></label>
      <label><input type="radio" name="ano" value="1º EM"><span>1ºEM</span></label>
      <label><input type="radio" name="ano" value="2º EM"><span>2ºEM</span></label>
      <label><input type="radio" name="ano" value="3º EM"><span>3ºEM</span></label>
    </div>
    <div class="subtitle">Qual sua turma?</div>
    <div class="grupo-sel">
      <label><input type="radio" name="turma" value="A"><span>A</span></label>
      <label><input type="radio" name="turma" value="B"><span>B</span></label>
      <label><input type="radio" name="turma" value="C"><span>C</span></label>
      <label><input type="radio" name="turma" value="D"><span>D</span></label>
    </div>
    <div class="aviso" id="loginAviso"></div>
    <button class="btn-entrar" onclick="realizarLogin()">Entrar</button>
  </div>
</div>

<!-- Firebase compat SDK (students don't need Auth) -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig={apiKey:"AIzaSyAAHGPjuRvE9VpHR469A5RbSEUzxl1zq2w",authDomain:"profbase-5f9b0.firebaseapp.com",databaseURL:"https://profbase-5f9b0-default-rtdb.firebaseio.com",projectId:"profbase-5f9b0",storageBucket:"profbase-5f9b0.firebasestorage.app",messagingSenderId:"826412057766",appId:"1:826412057766:web:729e6e24ce7587417fe067"};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

/* ── URL PARAMS ── */
const urlParams=new URLSearchParams(location.search);
const turmaId=urlParams.get('turmaId')||'';
const basePath=turmaId?'turmas_fluxo/'+turmaId+'/':'';

/* ── STATE ── */
let alunoId=localStorage.getItem('fluxo_firebaseId');
let alunoNome='';
let alunoSerie='';
let fluxoData=null; // {nodes:{...}}
let atividadeId=null;
let flowOwnerId=null;
let nodeAtual=null;
let fluxoPercorrido=[];
let respostas={};
let acertos=0;
let erros=0;
let totalNodes=0;
let answered=false;

/* ── LOAD TURMA + FLOW ── */
async function init(){
  if(!turmaId){
    $('loadingMsg').textContent='Link inválido. Peça um novo link ao professor.';
    return;
  }

  // Load turma info
  try{
    const snap=await db.ref('turmas_fluxo/'+turmaId).once('value');
    if(!snap.exists()){$('loadingMsg').textContent='Turma não encontrada.';return}
    const turma=snap.val();
    atividadeId=turma.atividadeId;
    flowOwnerId=turma.criadoPor;
    if(!atividadeId){$('loadingMsg').textContent='Nenhuma atividade conectada a esta turma.';return}
  }catch(e){console.error(e);$('loadingMsg').textContent='Erro ao carregar turma.';return}

  // Load flow
  try{
    const snap=await db.ref('fluxos/'+flowOwnerId+'/'+atividadeId).once('value');
    if(!snap.exists()){$('loadingMsg').textContent='Atividade não encontrada.';return}
    fluxoData=snap.val();
  }catch(e){console.error(e);$('loadingMsg').textContent='Erro ao carregar atividade.';return}

  // Count question nodes
  if(fluxoData.nodes){
    totalNodes=Object.values(fluxoData.nodes).filter(n=>n.tipo==='multipla_escolha'||n.tipo==='dissertativa').length;
  }

  $('loadingMsg').style.display='none';

  // Check if student already identified
  const savedNome=localStorage.getItem('fluxo_nome');
  const savedSerie=localStorage.getItem('fluxo_serie');
  if(savedNome&&savedSerie){
    alunoNome=savedNome;
    alunoSerie=savedSerie;
    await syncStudent();
    startFlow();
  }else{
    $('loginModal').classList.add('show');
  }
}

/* ── LOGIN ── */
window.realizarLogin=async function(){
  const nome=$('inputNome').value.trim();
  const anoEl=document.querySelector('input[name=ano]:checked');
  const turmaEl=document.querySelector('input[name=turma]:checked');

  if(!nome){$('loginAviso').textContent='Digite seu nome.';return}
  if(nome.includes(' ')){$('loginAviso').textContent='Apenas o primeiro nome.';return}
  if(nome.length>15){$('loginAviso').textContent='Máximo 15 letras.';return}
  if(!anoEl||!turmaEl){$('loginAviso').textContent='Selecione ano e turma.';return}

  alunoNome=nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase();
  alunoSerie=anoEl.value+' '+turmaEl.value;
  localStorage.setItem('fluxo_nome',alunoNome);
  localStorage.setItem('fluxo_serie',alunoSerie);

  // Create student in Firebase
  if(!alunoId){
    const newRef=db.ref(basePath+'alunos').push();
    alunoId=newRef.key;
    localStorage.setItem('fluxo_firebaseId',alunoId);
  }

  await db.ref(basePath+'alunos/'+alunoId).update({
    nome:alunoNome,
    serie:alunoSerie,
    entrouEm:new Date().toISOString(),
    status:'online',
    acertos:0,
    erros:0,
    fluxoPercorrido:[],
    respostas:{}
  });

  $('loginModal').classList.remove('show');
  startFlow();
};

async function syncStudent(){
  if(!alunoId){
    const newRef=db.ref(basePath+'alunos').push();
    alunoId=newRef.key;
    localStorage.setItem('fluxo_firebaseId',alunoId);
  }
  await db.ref(basePath+'alunos/'+alunoId).update({
    nome:alunoNome,
    serie:alunoSerie,
    entrouEm:new Date().toISOString(),
    status:'online',
    ultimoAcesso:new Date().toISOString()
  });

  // Load existing progress
  try{
    const snap=await db.ref(basePath+'alunos/'+alunoId).once('value');
    if(snap.exists()){
      const d=snap.val();
      acertos=d.acertos||0;
      erros=d.erros||0;
      fluxoPercorrido=d.fluxoPercorrido||[];
      respostas=d.respostas||{};
    }
  }catch(e){}
}

/* ── START FLOW ── */
function startFlow(){
  $('headerBar').style.display='flex';
  $('progressWrap').style.display='block';
  updateBadges();

  // Find start node
  const startNode=Object.values(fluxoData.nodes).find(n=>n.tipo==='inicio');
  if(!startNode){$('questionArea').innerHTML='<div class="loading">Fluxo sem nó de início.</div>';return}

  // If student has progress, resume from last node
  if(fluxoPercorrido.length>0){
    const lastNodeId=fluxoPercorrido[fluxoPercorrido.length-1];
    const lastNode=fluxoData.nodes[lastNodeId];
    if(lastNode&&lastNode.tipo!=='fim'){
      // Check if they answered the last node
      if(respostas[lastNodeId]){
        // Answered, move to next based on response
        const nextId=getNextNode(lastNodeId,respostas[lastNodeId]);
        if(nextId&&fluxoData.nodes[nextId]){
          nodeAtual=nextId;
        }else{
          nodeAtual=lastNodeId;
        }
      }else{
        nodeAtual=lastNodeId;
      }
    }else if(lastNode&&lastNode.tipo==='fim'){
      showEndScreen();
      return;
    }else{
      nodeAtual=getFirstQuestion(startNode);
    }
  }else{
    nodeAtual=getFirstQuestion(startNode);
  }

  if(!nodeAtual){showEndScreen();return}
  if(!fluxoPercorrido.includes(nodeAtual)){
    fluxoPercorrido.push(nodeAtual);
    saveProgress();
  }
  renderQuestion();
}

function getFirstQuestion(startNode){
  if(!startNode.conexoes||!startNode.conexoes.proximo) return null;
  return startNode.conexoes.proximo;
}

function getNextNode(nodeId,resposta){
  const node=fluxoData.nodes[nodeId];
  if(!node||!node.conexoes) return null;
  if(node.tipo==='multipla_escolha'){
    return resposta.acertou?node.conexoes.acerto:node.conexoes.erro;
  }
  if(node.tipo==='dissertativa'){
    return node.conexoes.concluido;
  }
  if(node.tipo==='inicio'){
    return node.conexoes.proximo;
  }
  return null;
}

/* ── RENDER QUESTION ── */
function renderQuestion(){
  const node=fluxoData.nodes[nodeAtual];
  if(!node){showEndScreen();return}
  if(node.tipo==='fim'){showEndScreen();return}

  answered=false;
  updateProgress();

  const area=$('questionArea');
  const stepNum=fluxoPercorrido.filter(id=>{
    const n=fluxoData.nodes[id];
    return n&&(n.tipo==='multipla_escolha'||n.tipo==='dissertativa');
  }).length;

  let html=`<div class="q-card">`;
  html+=`<div class="q-step">Questão ${stepNum} de ${totalNodes}</div>`;

  if(node.imgUrl){
    html+=`<img class="q-img" src="${esc(node.imgUrl)}" alt="Imagem">`;
  }

  html+=`<div class="q-text">${esc(node.pergunta||'Pergunta sem texto.')}</div>`;

  if(node.tipo==='multipla_escolha'){
    html+=`<div class="opts" id="optsContainer">`;
    (node.opcoes||[]).forEach((opt,i)=>{
      html+=`<button class="btn-opt" data-idx="${i}" onclick="responderMC(${i})">${esc(opt)}</button>`;
    });
    html+=`</div>`;
  }else if(node.tipo==='dissertativa'){
    html+=`<textarea class="q-textarea" id="respDissertativa" placeholder="Digite sua resposta..."></textarea>`;
    html+=`<button class="btn-enviar" id="btnEnviar" onclick="responderDissertativa()">Enviar Resposta</button>`;
  }

  html+=`<div class="feedback" id="feedback"></div>`;
  html+=`<button class="btn-next" id="btnNext" onclick="proximaQuestao()">Próxima Questão</button>`;
  html+=`</div>`;

  area.innerHTML=html;

  // If already answered (resuming), show the answer
  if(respostas[nodeAtual]){
    showSavedAnswer(node,respostas[nodeAtual]);
  }

  window.scrollTo({top:0,behavior:'smooth'});
}

function showSavedAnswer(node,resp){
  answered=true;
  if(node.tipo==='multipla_escolha'){
    const btns=document.querySelectorAll('.btn-opt');
    btns.forEach(b=>b.disabled=true);
    const chosen=btns[resp.escolha];
    if(chosen){
      chosen.classList.add(resp.acertou?'certo':'errado');
    }
    if(!resp.acertou){
      const corrIdx=node.correta;
      if(btns[corrIdx]) btns[corrIdx].classList.add('certo');
    }
    const fb=$('feedback');
    fb.className='feedback show '+(resp.acertou?'acerto':'erro');
    fb.innerHTML=`<div class="fb-title">${resp.acertou?'Resposta Correta!':'Resposta Incorreta'}</div>`;
  }else if(node.tipo==='dissertativa'){
    const ta=$('respDissertativa');
    if(ta){ta.value=resp.texto||'';ta.disabled=true}
    const btn=$('btnEnviar');
    if(btn) btn.disabled=true;
    const fb=$('feedback');
    fb.className='feedback show dissertativa';
    fb.innerHTML='<div class="fb-title">Resposta enviada</div>';
  }
  $('btnNext').style.display='block';
}

/* ── RESPOND MC ── */
window.responderMC=function(idx){
  if(answered) return;
  answered=true;

  const node=fluxoData.nodes[nodeAtual];
  const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
  const acertou=corretas.includes(idx);

  if(acertou) acertos++;
  else erros++;

  respostas[nodeAtual]={tipo:'multipla_escolha',escolha:idx,acertou,timestamp:new Date().toISOString()};
  saveProgress();

  // Visual feedback
  const btns=document.querySelectorAll('.btn-opt');
  btns.forEach(b=>b.disabled=true);
  btns[idx].classList.add(acertou?'certo':'errado');
  if(!acertou){
    corretas.forEach(ci=>{if(btns[ci]) btns[ci].classList.add('certo')});
  }

  const fb=$('feedback');
  fb.className='feedback show '+(acertou?'acerto':'erro');
  fb.innerHTML=`<div class="fb-title">${acertou?'Resposta Correta!':'Resposta Incorreta'}</div>`;
  $('btnNext').style.display='block';
  updateBadges();
};

/* ── RESPOND DISSERTATIVA ── */
window.responderDissertativa=function(){
  if(answered) return;
  const texto=$('respDissertativa').value.trim();
  if(!texto){return}
  answered=true;

  respostas[nodeAtual]={tipo:'dissertativa',texto,timestamp:new Date().toISOString()};
  saveProgress();

  $('respDissertativa').disabled=true;
  $('btnEnviar').disabled=true;

  const fb=$('feedback');
  fb.className='feedback show dissertativa';
  fb.innerHTML='<div class="fb-title">Resposta enviada!</div>';
  $('btnNext').style.display='block';
};

/* ── NEXT QUESTION ── */
window.proximaQuestao=function(){
  const nextId=getNextNode(nodeAtual,respostas[nodeAtual]);
  if(!nextId||!fluxoData.nodes[nextId]){
    showEndScreen();
    return;
  }
  nodeAtual=nextId;
  if(!fluxoPercorrido.includes(nodeAtual)){
    fluxoPercorrido.push(nodeAtual);
  }
  saveProgress();
  renderQuestion();
};

/* ── END SCREEN ── */
function showEndScreen(){
  $('progressFill').style.width='100%';
  $('questionArea').innerHTML=`
    <div class="end-screen">
      <h1>Atividade Concluída!</h1>
      <div class="big-name">${esc(alunoNome)}</div>
      <p style="color:var(--text2)">Parabéns por completar o percurso!</p>
      <div class="stats">
        <div><div class="stat-val" style="color:var(--success)">${acertos}</div><div class="stat-label">Acertos</div></div>
        <div><div class="stat-val" style="color:var(--error)">${erros}</div><div class="stat-label">Erros</div></div>
      </div>
    </div>`;
  saveProgress();
}

/* ── SAVE PROGRESS ── */
function saveProgress(){
  if(!alunoId) return;
  db.ref(basePath+'alunos/'+alunoId).update({
    acertos,
    erros,
    fluxoPercorrido,
    respostas,
    nodeAtual,
    ultimoAcesso:new Date().toISOString()
  });
}

/* ── UPDATE UI ── */
function updateBadges(){
  $('badgeNome').textContent=alunoNome;
  $('badgeSerie').textContent=alunoSerie;
  $('badgeAcertos').textContent=acertos+' acertos';
  $('badgeErros').textContent=erros+' erros';
}

function updateProgress(){
  const answered=Object.keys(respostas).length;
  const pct=totalNodes>0?Math.min(100,(answered/totalNodes)*100):0;
  $('progressFill').style.width=pct+'%';
}

/* ── INIT ── */
init();
</script>
</body>
</html>
