<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividade — AlquiLab</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#0A84FF;--green:#30D158;--red:#FF453A;--yellow:#FFD60A;
  --text:rgba(255,255,255,.92);--text2:rgba(255,255,255,.48);--text3:rgba(255,255,255,.24);
  --border:rgba(255,255,255,.10);--glass:rgba(255,255,255,.055);
  --bg:#0a0a0c;--bg2:#141418;--bg3:#1c1c1f;
  --success:#30D158;--error:#FF453A;
  --r:20px;--rs:12px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#000;color:var(--text);overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  padding-top:52px;
}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 55% at 15% 5%,rgba(10,132,255,.13) 0%,transparent 60%),
    radial-gradient(ellipse 60% 45% at 85% 85%,rgba(94,92,230,.09) 0%,transparent 60%),
    #000;
}
.noise{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.45;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E");
}
@media print{html,body{display:none!important}}

/* HEADER fixo */
header.app-header{
  position:fixed;top:0;left:0;right:0;z-index:100;height:52px;
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;
  background:rgba(0,0,0,.52);backdrop-filter:blur(20px) saturate(1.8);
  border-bottom:.5px solid rgba(255,255,255,.07);
}
.hlogo{font-size:.84rem;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.hlogo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  font-size:.74rem;font-weight:500;color:var(--text2);
  background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.10);
  border-radius:999px;padding:5px 12px;
}
.chip.green{color:var(--green);background:rgba(48,209,88,.10);border-color:rgba(48,209,88,.30)}
.chip.red{color:var(--red);background:rgba(255,69,58,.10);border-color:rgba(255,69,58,.30)}

.container{width:100%;max-width:1100px;margin:0 auto;padding:22px 18px 80px;position:relative;z-index:5}

/* Barra de progresso */
.progress-wrap{width:100%;max-width:640px;margin:0 auto 22px;height:6px;
  background:rgba(255,255,255,.06);border:.5px solid var(--border);border-radius:6px;overflow:hidden}
.progress-fill{height:100%;width:0%;background:var(--accent);transition:width .4s ease}

/* CARD DA QUESTÃO */
.q-card{
  background:rgba(14,14,18,.78);border:.5px solid var(--border);border-radius:24px;
  overflow:hidden;box-shadow:0 4px 40px rgba(0,0,0,.40);
  backdrop-filter:blur(18px);
}
.qcard-inner{display:flex;min-height:520px}
.q-img-side{
  width:490px;min-width:490px;max-width:490px;position:relative;
  background:rgba(0,0,0,.30);border-right:.5px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;overflow:hidden;
}
.q-img-side img{width:100%;height:100%;object-fit:cover;position:relative;z-index:2}
.q-img-side::before{
  content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:40px 40px;
}
.q-content-side{flex:1;padding:28px 28px 26px;display:flex;flex-direction:column;min-width:0}
.qmeta{display:flex;align-items:center;gap:9px;margin-bottom:14px}
.qnum{font-size:.72rem;font-weight:600;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.qstem{font-size:1rem;font-weight:400;color:var(--text);line-height:1.72;margin-bottom:22px;white-space:pre-wrap;word-wrap:break-word}
.qstem strong,.qstem b{font-weight:600;color:#fff}

/* OPÇÕES MC */
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.opt{
  display:flex;align-items:center;gap:13px;padding:13px 15px;
  background:rgba(255,255,255,.038);border:.5px solid rgba(255,255,255,.08);
  border-radius:var(--rs);cursor:pointer;transition:all .17s;user-select:none;
}
.opt:hover{background:rgba(255,255,255,.075);border-color:rgba(255,255,255,.15)}
.opt .ok{
  width:27px;height:27px;min-width:27px;
  background:rgba(255,255,255,.055);border:.5px solid rgba(255,255,255,.13);
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.70rem;font-weight:700;color:var(--text2);transition:all .17s;
}
.opt .ot{font-size:.92rem;font-weight:400;color:var(--text)}
.opt.selected{background:rgba(10,132,255,.11);border-color:rgba(10,132,255,.38)}
.opt.selected .ok{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.correct{background:rgba(48,209,88,.09);border-color:rgba(48,209,88,.38)}
.opt.correct .ok{background:var(--green);border-color:var(--green);color:#000}
.opt.wrong{background:rgba(255,69,58,.09);border-color:rgba(255,69,58,.33)}
.opt.wrong .ok{background:var(--red);border-color:var(--red);color:#fff}
.opt.show-correct{background:rgba(48,209,88,.07);border-color:rgba(48,209,88,.28)}
.opt.show-correct .ok{background:var(--green);border-color:var(--green);color:#000}
.opt.dim{opacity:.22;pointer-events:none}

/* DISSERTATIVA */
.diss-area{
  width:100%;min-height:120px;padding:14px 16px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-family:inherit;font-size:.95rem;line-height:1.65;resize:vertical;outline:none;transition:border-color .2s;
}
.diss-area:focus{border-color:var(--accent);background:rgba(10,132,255,.04)}
.diss-area::placeholder{color:rgba(255,255,255,.18)}
.diss-area.sent{opacity:.6;cursor:default}
.diss-counter{font-size:.72rem;color:var(--text3);margin-top:6px;font-weight:500}
.diss-counter.ok{color:var(--green)}
.diss-error{font-size:.78rem;color:var(--red);margin-top:4px;display:none}

/* FEEDBACK */
.fb{display:none;font-size:.85rem;line-height:1.65;padding:13px 16px;border-radius:var(--rs);margin-bottom:15px}
.fb.ok-fb{background:rgba(48,209,88,.09);border:.5px solid rgba(48,209,88,.28);color:rgba(48,209,88,.9)}
.fb.err-fb{background:rgba(255,69,58,.09);border:.5px solid rgba(255,69,58,.28);color:rgba(255,100,90,.95)}
.fb strong{font-weight:700}

/* AÇÕES */
.act-row{display:flex;align-items:center;gap:10px;margin-top:auto}
.btn-chk{
  padding:11px 22px;background:rgba(10,132,255,.13);
  border:.5px solid rgba(10,132,255,.28);border-radius:10px;color:var(--accent);
  font-family:inherit;font-size:.87rem;font-weight:600;cursor:pointer;transition:all .18s;
}
.btn-chk:hover:not(:disabled){background:rgba(10,132,255,.22);box-shadow:0 0 22px rgba(10,132,255,.3)}
.btn-chk:disabled{opacity:.22;cursor:not-allowed}
.btn-next{
  display:none;padding:11px 22px;
  background:rgba(255,255,255,.07);border:.5px solid rgba(255,255,255,.14);
  border-radius:10px;color:var(--text);font-family:inherit;font-size:.87rem;font-weight:600;
  cursor:pointer;transition:all .18s;
}
.btn-next:hover{background:rgba(255,255,255,.12)}

/* Resolução (mostrada após verificar) */
.resolucao{
  margin-top:16px;padding:14px 16px;border-radius:var(--rs);
  background:rgba(10,132,255,.08);border:.5px solid rgba(10,132,255,.24);
  font-size:.9rem;line-height:1.6;color:var(--text);
}
.resolucao .rt{
  font-weight:700;margin-bottom:4px;color:var(--accent);
  font-size:.68rem;text-transform:uppercase;letter-spacing:.10em;
}

/* Responsivo: empilha em telas pequenas */
@media(max-width:900px){
  .qcard-inner{flex-direction:column}
  .q-img-side{width:100%!important;min-width:0!important;max-width:100%!important;height:300px;border-right:none;border-bottom:.5px solid var(--border)}
  .q-content-side{padding:22px}
}

/* Final */
.end-screen{
  text-align:center;padding:48px 30px;
  background:rgba(14,14,18,.80);border:.5px solid var(--border);border-radius:24px;
  box-shadow:0 4px 60px rgba(0,0,0,.5);color:var(--text);backdrop-filter:blur(30px);
}
.end-screen h1{font-size:1.5rem;font-weight:700;margin-bottom:6px}
.end-screen .big-name{font-size:1.45rem;font-weight:700;color:var(--accent);margin:6px 0 4px}
.end-screen .meta{font-size:.8rem;color:var(--text2);margin-bottom:6px}
.end-screen .div{width:40px;height:.5px;background:rgba(255,255,255,.10);margin:20px auto}
.end-screen .msg{font-size:.9rem;color:var(--text2);max-width:340px;margin:0 auto;line-height:1.68}
.end-screen .stats{display:flex;gap:12px;justify-content:center;margin-top:22px;flex-wrap:wrap}
.end-screen .rstat{padding:12px 20px;border-radius:12px;text-align:center;min-width:100px}
.end-screen .rstat-label{font-size:.65rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.end-screen .rstat-val{font-size:1.3rem;font-weight:800}

/* Timer footer */
.timer-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:500;
  background:rgba(20,20,24,.92);backdrop-filter:blur(12px);
  border-top:.5px solid var(--border);
  padding:12px 20px;display:none;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 -4px 20px rgba(0,0,0,.5);
}
.timer-footer.show{display:flex}
.timer-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.10em;color:var(--text2)}
.timer-val{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.timer-val.warn{color:#ff9500}
.timer-val.danger{color:var(--error)}
.timer-bar{width:220px;height:6px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.timer-bar>div{height:100%;width:100%;background:var(--green);transition:width .5s linear,background .3s}

/* Modals */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;z-index:9000;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:rgba(22,22,26,.92);padding:28px 26px;border-radius:22px;width:100%;max-width:420px;text-align:center;box-shadow:0 32px 80px rgba(0,0,0,.6);border:.5px solid var(--border);color:var(--text);backdrop-filter:blur(40px)}
.modal h2{font-size:1.2rem;font-weight:700;margin-bottom:6px;color:var(--text)}
.modal p{font-size:.85rem;color:var(--text2);margin-bottom:16px;line-height:1.5}
.modal input{width:100%;padding:13px 16px;background:rgba(255,255,255,.055);border:1px solid var(--border);border-radius:12px;font-size:.95rem;text-align:center;outline:none;margin-bottom:8px;font-family:inherit;color:var(--text);transition:border-color .2s}
.modal input:focus{border-color:var(--accent);background:rgba(10,132,255,.08)}
.aviso{color:var(--error);font-size:.78rem;font-weight:600;min-height:1em;margin:4px 0}
.btn-entrar{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;margin-top:6px;font-family:inherit;transition:opacity .2s}
.btn-entrar:hover{opacity:.88}

/* Prova lock overlay (student side) */
.lock-overlay{position:fixed;inset:0;z-index:9999;background:rgba(7,7,12,.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:20px}
.lock-overlay.show{display:flex}
.lock-popup{background:rgba(18,18,28,.94);border:1px solid rgba(255,255,255,.14);border-radius:20px;padding:32px;max-width:440px;width:100%;text-align:center;color:#f4f4f8}
.lock-popup .lbadge{display:inline-block;padding:5px 14px;border-radius:50px;background:rgba(255,45,111,.15);border:1px solid rgba(255,45,111,.45);color:#ff2d6f;font-size:.66rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;margin-bottom:14px}
.lock-popup h1{font-size:1.5rem;margin-bottom:10px}
.lock-popup .vio{color:#ff2d6f;font-weight:600;font-size:.88rem;margin-bottom:14px;padding:8px 12px;border-radius:8px;background:rgba(255,45,111,.1);border:1px solid rgba(255,45,111,.3)}
.lock-popup .sub{color:#8a8aa0;font-size:.86rem;margin-bottom:18px;line-height:1.5}
.lock-popup input{width:100%;padding:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);border-radius:10px;color:#fff;font-size:1rem;outline:none;margin-bottom:10px;font-family:inherit}
.lock-popup input:focus{border-color:#ff2d6f}
.lock-popup .err{color:#ff2d6f;font-size:.8rem;min-height:1em;margin-bottom:8px}
.lock-popup button{width:100%;padding:13px;background:linear-gradient(135deg,#ff2d6f,#b14bff);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit}

.loading{text-align:center;padding:60px;color:var(--text2);font-size:1rem;position:relative;z-index:5}

@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fu{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Timer footer */
.timer-footer{
  position:fixed;left:0;right:0;bottom:0;z-index:500;
  background:rgba(20,20,24,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);
  padding:12px 20px;display:none;align-items:center;justify-content:center;gap:14px;
  box-shadow:0 -4px 20px rgba(0,0,0,.5);
}

.timer-val{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.timer-val.warn{color:#ff9500}
.timer-val.danger{color:var(--error)}
.timer-bar{width:220px;height:6px;background:#2a2a2e;border-radius:4px;overflow:hidden}
.timer-bar>div{height:100%;width:100%;background:var(--success);transition:width .5s linear,background .3s}

/* Modals */

.btn-entrar{width:100%;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:1rem;font-weight:600;cursor:pointer;margin-top:6px}

.lock-overlay{position:fixed;inset:0;z-index:9999;background:rgba(7,7,12,.9);backdrop-filter:blur(20px);display:none;align-items:center;justify-content:center;padding:20px}

.lock-popup .sub{color:#8a8aa0;font-size:.86rem;margin-bottom:18px;line-height:1.5}

.lock-popup input:focus{border-color:#ff2d6f}

@media(max-width:720px){
  .q-split{grid-template-columns:1fr}

}
</style>
</head>
<body>

<div class="bg"></div>
<div class="noise"></div>

<header class="app-header">
  <div class="hlogo">Atividade <span>AlquiLab</span></div>
  <div class="header-right" id="headerRight" style="display:none">
    <span class="chip" id="badgeNome">Aluno</span>
    <span class="chip" id="badgeCodigo" title="Seu código de acesso. Anote para retomar de outro dispositivo." style="cursor:pointer;font-family:'SF Mono','JetBrains Mono',Consolas,monospace;letter-spacing:.06em">CÓDIGO</span>
  </div>
</header>

<div class="container">
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div id="questionArea"></div>

  <div id="loadingMsg" class="loading">Carregando atividade...</div>
</div>

<!-- Timer footer -->
<div class="timer-footer" id="timerFooter">
  <div class="timer-label">Tempo</div>
  <div class="timer-val" id="timerVal">00:00</div>
  <div class="timer-bar"><div id="timerBar"></div></div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal-overlay">
  <div class="modal">
    <h2>Identificação</h2>
    <p>Digite seu nome para entrar — ou cole seu código se já começou antes.</p>
    <div id="turmaInfo" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:.88rem;color:var(--text2);line-height:1.5"></div>
    <input type="text" id="inputNome" placeholder="Qual o seu nome?" maxlength="15">
    <div style="display:flex;align-items:center;gap:10px;margin:10px 0;color:var(--text3);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;font-weight:600">
      <div style="flex:1;height:1px;background:var(--border)"></div><span>ou</span><div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <input type="text" id="inputCodigo" placeholder="Cole seu código (#nome12345)" maxlength="30" style="font-family:'SF Mono',monospace;letter-spacing:.05em">
    <div class="aviso" id="loginAviso"></div>
    <button class="btn-entrar" onclick="realizarLogin()">Entrar</button>
  </div>
</div>

<!-- Prova Lock -->
<div id="lockOverlay" class="lock-overlay">
  <div class="lock-popup">
    <div class="lbadge">Tela Bloqueada</div>
    <h1>Acesso Suspenso</h1>
    <div class="vio" id="violationMsg">Violação detectada</div>
    <div class="sub">Peça ao professor para inserir a senha de desbloqueio.</div>
    <input id="senhaInput" type="password" placeholder="Senha do professor" autocomplete="off">
    <div class="err" id="errMsg"></div>
    <button id="btnDesbloquear">Desbloquear</button>
  </div>
</div>

const db=firebase.database();

const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

const urlParams=new URLSearchParams(location.search);
const turmaId=urlParams.get('turmaId')||'';
const basePath=turmaId?'turmas_fluxo/'+turmaId+'/':'';

let alunoId=localStorage.getItem('fluxo_firebaseId');
let alunoNome='',alunoSerie='',turmaInfo=null;
let alunoCodigo=localStorage.getItem('fluxo_codigo')||'';

function gerarCodigoAluno(nome){
  const base=(nome||'aluno').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,'').slice(0,8) || 'aluno';
  const num=String(Math.floor(10000+Math.random()*90000));
  return '#'+base+num;
}
let fluxoData=null,atividadeId=null,flowOwnerId=null;
let nodeAtual=null,fluxoPercorrido=[],respostas={};
let acertos=0,erros=0,totalNodes=0,answered=false;
let provaActive=false,locked=false;
let timerInterval=null,timerSec=0,timerMax=0;
let currentShuffleMap=null; // for MC: displayIdx -> originalIdx

async function init(){
  if(!turmaId){$('loadingMsg').textContent='Link inválido. Peça um novo link ao professor.';return}
  try{
    const snap=await db.ref('turmas_fluxo/'+turmaId).once('value');
    if(!snap.exists()){$('loadingMsg').textContent='Turma não encontrada.';return}
    const turma=snap.val();
    // Modo teste: link expira em 1h após criação
    if(turma.guest && turma.expiresAt && Date.now() > turma.expiresAt){
      $('loadingMsg').textContent='Este link foi criado em modo de teste e já expirou (1 hora). Peça ao professor um novo link.';
      return;
    }
    turmaInfo=turma;atividadeId=turma.atividadeId;flowOwnerId=turma.criadoPor;
    if(!atividadeId){$('loadingMsg').textContent='Nenhuma atividade conectada.';return}
    alunoSerie=((turma.serie||'')+' '+(turma.turma||'')).trim();
    const ti=$('turmaInfo');
    if(ti) ti.innerHTML='<b>'+esc(turma.escola||'Escola')+'</b><br>'+esc(turma.serie||'')+(turma.turma?' · Turma '+esc(turma.turma):'');
  }catch(e){console.error(e);$('loadingMsg').textContent='Erro ao carregar turma.';return}

  try{
    const snap=await db.ref('fluxos/'+flowOwnerId+'/'+atividadeId).once('value');
    if(!snap.exists()){$('loadingMsg').textContent='Atividade não encontrada.';return}
    fluxoData=snap.val();
  }catch(e){console.error(e);$('loadingMsg').textContent='Erro ao carregar atividade.';return}

  if(fluxoData.nodes) totalNodes=Object.values(fluxoData.nodes).filter(n=>n.tipo==='multipla_escolha'||n.tipo==='dissertativa').length;

  $('loadingMsg').style.display='none';

  const savedNome=localStorage.getItem('fluxo_nome');
  if(savedNome){
    alunoNome=savedNome;
    await syncStudent();
    askProvaThenStart();
  }else{
    $('loginModal').classList.add('show');
    setTimeout(()=>$('inputNome').focus(),100);
  }
}

/* Antes de iniciar o fluxo, se for modo prova, mostra tela "Iniciar Prova"
   que captura o gesto do usuário necessário para entrar em fullscreen. */
function askProvaThenStart(){
  if(fluxoData && fluxoData.provaMode){
    showProvaStartScreen();
  }else{
    startFlow();
  }
}

function showProvaStartScreen(){
  const ov=document.createElement('div');
  ov.className='modal-overlay show';
  ov.id='provaStartOv';
  ov.style.zIndex='9700';
  ov.innerHTML=`<div class="modal" style="max-width:480px;text-align:center">
    <div style="display:inline-block;padding:6px 16px;border-radius:50px;background:rgba(255,159,10,.16);border:1px solid rgba(255,159,10,.45);color:#ff9f0a;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px">Modo Prova</div>
    <h2 style="font-size:1.4rem;margin-bottom:8px">Atividade em Modo Prova</h2>
    <p style="font-size:.9rem;line-height:1.6;color:var(--text2);margin-bottom:18px">
      Esta atividade está em <b style="color:var(--text)">Modo Prova</b>. Ao iniciar, o navegador entrará em <b>tela cheia</b> e o sistema vai bloquear:<br><br>
      • Trocar de aba ou janela<br>
      • Sair da tela cheia (Esc, F11)<br>
      • Atalhos de cópia, colar, recarregar<br>
      • Menu de contexto (clique direito)<br><br>
      Apenas o professor poderá desbloquear com a senha.
    </p>
    <button class="btn-entrar" id="btnIniciarProva" style="background:linear-gradient(135deg,#ff8a00,#ff2d6f)">Iniciar Modo Prova</button>
  </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{
    const btn=document.getElementById('btnIniciarProva');
    if(btn){
      btn.onclick=async ()=>{
        // Gesto do usuário — pode entrar em fullscreen aqui
        try{
          if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
          else if(document.documentElement.webkitRequestFullscreen) await document.documentElement.webkitRequestFullscreen();
          else if(document.documentElement.mozRequestFullScreen) await document.documentElement.mozRequestFullScreen();
        }catch(e){ console.warn('Fullscreen falhou:',e) }
        provaActive=true;
        installProvaHandlers();
        ov.remove();
        startFlow();
      };
    }
  },50);
}

window.realizarLogin=async function(){
  // Caso 1: aluno colou um código de retomada
  const codigoInput=($('inputCodigo')&&$('inputCodigo').value||'').trim();
  if(codigoInput){
    const codigo = codigoInput.startsWith('#') ? codigoInput : ('#'+codigoInput);
    try{
      const snap=await db.ref(basePath+'alunos').once('value');
      const data=snap.val()||{};
      let foundKey=null, foundData=null;
      Object.keys(data).forEach(k=>{ if(data[k] && data[k].codigo===codigo){ foundKey=k; foundData=data[k] } });
      if(!foundKey){ $('loginAviso').textContent='Código não encontrado.'; return }
      alunoId=foundKey;
      localStorage.setItem('fluxo_firebaseId',alunoId);
      alunoNome=foundData.nome||'Aluno';
      alunoSerie=foundData.serie||alunoSerie||'—';
      alunoCodigo=codigo;
      localStorage.setItem('fluxo_nome',alunoNome);
      localStorage.setItem('fluxo_serie',alunoSerie);
      localStorage.setItem('fluxo_codigo',alunoCodigo);
      acertos=foundData.acertos||0; erros=foundData.erros||0;
      fluxoPercorrido=foundData.fluxoPercorrido||[]; respostas=foundData.respostas||{};
      await db.ref(basePath+'alunos/'+alunoId).update({status:'online',ultimoAcesso:new Date().toISOString()});
      $('loginModal').classList.remove('show');
      askProvaThenStart();
      return;
    }catch(e){ console.error(e); $('loginAviso').textContent='Erro ao validar código.'; return }
  }
  // Caso 2: novo aluno (nome)
  const nome=$('inputNome').value.trim();
  if(!nome){$('loginAviso').textContent='Digite seu nome ou um código de retomada.';return}
  if(nome.includes(' ')){$('loginAviso').textContent='Apenas o primeiro nome.';return}
  if(nome.length>15){$('loginAviso').textContent='Máximo 15 letras.';return}
  // Limite de 5 alunos para links criados em modo de teste (visitante)
  if(turmaInfo && turmaInfo.guest){
    try{
      const snap = await db.ref(basePath+'alunos').once('value');
      const data = snap.val() || {};
      if(Object.keys(data).length >= 5){
        $('loginAviso').innerHTML='Este link foi criado em <b>modo de teste</b> e atingiu o limite de 5 alunos. Peça ao professor um novo link.';
        return;
      }
    }catch(e){ console.warn('Falha ao checar limite guest:', e); }
  }
  alunoNome=nome.charAt(0).toUpperCase()+nome.slice(1).toLowerCase();
  if(!alunoSerie) alunoSerie='—';
  alunoCodigo = gerarCodigoAluno(alunoNome);
  localStorage.setItem('fluxo_nome',alunoNome);
  localStorage.setItem('fluxo_serie',alunoSerie);
  localStorage.setItem('fluxo_codigo',alunoCodigo);
  if(!alunoId){const newRef=db.ref(basePath+'alunos').push();alunoId=newRef.key;localStorage.setItem('fluxo_firebaseId',alunoId)}
  await db.ref(basePath+'alunos/'+alunoId).update({
    nome:alunoNome,serie:alunoSerie,codigo:alunoCodigo,entrouEm:new Date().toISOString(),
    status:'online',acertos:0,erros:0,fluxoPercorrido:[],respostas:{}
  });
  $('loginModal').classList.remove('show');
  // Mostra o código numa caixa para o aluno copiar
  showCodigoPopup(alunoCodigo, ()=>{ askProvaThenStart() });
};

function showCodigoPopup(codigo, onClose){
  const ov = document.createElement('div');
  ov.className='modal-overlay show';
  ov.style.zIndex='9500';
  ov.innerHTML=`<div class="modal" style="text-align:center">
    <h2 style="color:var(--accent)">Seu código de acesso</h2>
    <p>Anote este código. Você pode usá-lo para retomar a atividade em outro computador ou se fechar o navegador.</p>
    <div style="font-family:'SF Mono',monospace;font-size:1.6rem;font-weight:800;color:var(--accent);background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:16px;margin:14px 0;letter-spacing:.06em;word-break:break-all">${codigo}</div>
    <button class="btn-entrar" id="btnCodigoOk">Entendi</button>
  </div>`;
  document.body.appendChild(ov);
  setTimeout(()=>{
    const b=document.getElementById('btnCodigoOk');
    if(b) b.onclick=()=>{ ov.remove(); if(typeof onClose==='function') onClose() };
  },20);
}

async function syncStudent(){
  if(!alunoId){const newRef=db.ref(basePath+'alunos').push();alunoId=newRef.key;localStorage.setItem('fluxo_firebaseId',alunoId)}
  // Garante que tem código (caso aluno antigo sem código)
  if(!alunoCodigo){
    alunoCodigo = gerarCodigoAluno(alunoNome);
    localStorage.setItem('fluxo_codigo', alunoCodigo);
  }
  await db.ref(basePath+'alunos/'+alunoId).update({
    nome:alunoNome,serie:alunoSerie,codigo:alunoCodigo,
    status:'online',ultimoAcesso:new Date().toISOString()
  });
  try{
    const snap=await db.ref(basePath+'alunos/'+alunoId).once('value');
    if(snap.exists()){
      const d=snap.val();
      acertos=d.acertos||0;erros=d.erros||0;
      fluxoPercorrido=d.fluxoPercorrido||[];respostas=d.respostas||{};
      // Sincroniza código do servidor (autoritativo)
      if(d.codigo){ alunoCodigo=d.codigo; localStorage.setItem('fluxo_codigo',alunoCodigo) }
    }
  }catch(e){}
}

/* ── PROVA MODE ── */
function maybeActivateProva(){
  if(!fluxoData||!fluxoData.provaMode) return;
  provaActive=true;
  try{document.documentElement.requestFullscreen()}catch(e){}
  installProvaHandlers();
}

function installProvaHandlers(){
  const blockedKeys=new Set(['F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12']);
  document.addEventListener('keydown',e=>{
    if(!provaActive||locked) return;
    const tag=(e.target&&e.target.tagName)||'';
    const inInput=tag==='INPUT'||tag==='TEXTAREA';
    const k=e.key;
    if(blockedKeys.has(k)){e.preventDefault();e.stopPropagation();lock('Tecla bloqueada: '+k);return}
    if(k==='Escape'){e.preventDefault();e.stopPropagation();lock('Tentou sair da tela cheia');return}
    if(e.ctrlKey||e.metaKey){
      const low=(k||'').toLowerCase();
      if(inInput&&['c','v','x','a'].includes(low))return;
      if(['c','v','x','p','s','r','u','a','t','n','w'].includes(low)||(e.shiftKey&&['i','j','c'].includes(low))){
        e.preventDefault();e.stopPropagation();lock('Atalho bloqueado: Ctrl+'+k.toUpperCase());return;
      }
    }
  },true);
  document.addEventListener('contextmenu',e=>{if(provaActive){e.preventDefault();lock('Menu de contexto bloqueado')}});
  document.addEventListener('fullscreenchange',()=>{if(provaActive&&!document.fullscreenElement)lock('Saiu da tela cheia')});
  document.addEventListener('visibilitychange',()=>{if(provaActive&&document.hidden)lock('Trocou de aba')});
  window.addEventListener('blur',()=>{if(provaActive)setTimeout(()=>{if(!document.hasFocus())lock('Perdeu o foco da janela')},100)});
  window.addEventListener('beforeunload',e=>{if(provaActive){e.preventDefault();e.returnValue=''}});
}

function lock(reason){
  if(locked)return;locked=true;
  $('violationMsg').textContent=reason||'Violação detectada';
  $('errMsg').textContent='';$('senhaInput').value='';
  $('lockOverlay').classList.add('show');
  setTimeout(()=>$('senhaInput').focus(),60);
}
document.addEventListener('DOMContentLoaded',()=>{
  const bd=$('btnDesbloquear'),si=$('senhaInput');
  if(bd) bd.onclick=tryUnlock;
  if(si) si.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();tryUnlock()}});
});
async function tryUnlock(){
  const v=$('senhaInput').value;
  if(fluxoData&&fluxoData.provaMode&&v===fluxoData.provaMode.senha){
    locked=false;
    $('lockOverlay').classList.remove('show');
    try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen()}catch(e){}
  }else{
    $('errMsg').textContent='Senha incorreta.';$('senhaInput').value='';$('senhaInput').focus();
  }
}

/* ── FLOW ── */
function startFlow(){
  $('headerRight').style.display='flex';
  $('progressWrap').style.display='block';
  updateBadges();
  const startNode=Object.values(fluxoData.nodes).find(n=>n.tipo==='inicio');
  if(!startNode){$('questionArea').innerHTML='<div class="loading">Fluxo sem nó de início.</div>';return}
  if(fluxoPercorrido.length>0){
    const lastId=fluxoPercorrido[fluxoPercorrido.length-1];
    const lastNode=fluxoData.nodes[lastId];
    if(lastNode&&lastNode.tipo!=='fim'){
      if(respostas[lastId]){
        const nextId=getNextNode(lastId,respostas[lastId]);
        nodeAtual=(nextId&&fluxoData.nodes[nextId])?nextId:lastId;
      }else nodeAtual=lastId;
    }else if(lastNode&&lastNode.tipo==='fim'){showEndScreen();return}
    else nodeAtual=getFirstQuestion(startNode);
  }else nodeAtual=getFirstQuestion(startNode);
  if(!nodeAtual){showEndScreen();return}
  if(!fluxoPercorrido.includes(nodeAtual)){fluxoPercorrido.push(nodeAtual);saveProgress()}
  renderQuestion();
}

function getFirstQuestion(sn){return sn.conexoes&&sn.conexoes.proximo?sn.conexoes.proximo:null}
function getNextNode(id,resp){
  const n=fluxoData.nodes[id];if(!n||!n.conexoes)return null;
  if(n.tipo==='multipla_escolha')return resp&&resp.acertou?n.conexoes.acerto:n.conexoes.erro;
  if(n.tipo==='dissertativa')return n.conexoes.concluido;
  if(n.tipo==='inicio')return n.conexoes.proximo;
  return null;
}

function modifiersOf(nodeId){
  const mods=[];
  if(!fluxoData.nodes) return mods;
  Object.values(fluxoData.nodes).forEach(m=>{
    if((m.tipo==='mod_tempo'||m.tipo==='mod_shuffle'||m.tipo==='mod_embaralhar')&&m.attachedTo===nodeId) mods.push(m);
  });
  return mods;
}

function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ── RENDER ── */
let selectedDisplay=-1; // índice da opção selecionada antes de verificar

function renderQuestion(){
  stopTimer();
  currentShuffleMap=null;
  selectedDisplay=-1;
  const node=fluxoData.nodes[nodeAtual];
  if(!node){showEndScreen();return}
  if(node.tipo==='fim'){showEndScreen();return}

  answered=false;
  updateProgress();

  const area=$('questionArea');
  const stepNum=fluxoPercorrido.filter(id=>{const n=fluxoData.nodes[id];return n&&(n.tipo==='multipla_escolha'||n.tipo==='dissertativa')}).length;

  const mods=modifiersOf(nodeAtual);
  const hasShuffle=mods.some(m=>m.tipo==='mod_shuffle'||m.tipo==='mod_embaralhar'||m.kind==='embaralhar');
  const tempoMod=mods.find(m=>m.tipo==='mod_tempo'||m.kind==='tempo');

  const imgSrc=node.imgData||node.imgUrl||'';
  const hasImg=!!imgSrc;

  const isDiss=node.tipo==='dissertativa';

  let html=`<div class="q-card">`;
  html+=`<div class="qcard-inner">`;
  if(hasImg){
    html+=`<div class="q-img-side"><img src="${node.imgData?imgSrc:esc(imgSrc)}" alt="Questão"></div>`;
  }
  html+=`<div class="q-content-side">`;
  html+=`<div class="qmeta"><span class="qnum">Questão ${stepNum} de ${totalNodes}</span></div>`;
  if(node.pergunta) html+=`<p class="qstem">${esc(node.pergunta)}</p>`;

  if(node.tipo==='multipla_escolha'){
    let opcoes=(node.opcoes||[]).map((t,i)=>({t,orig:i}));
    if(hasShuffle&&!respostas[nodeAtual]) opcoes=shuffleArray(opcoes.slice());
    else if(respostas[nodeAtual]&&respostas[nodeAtual].shuffleMap){
      opcoes=respostas[nodeAtual].shuffleMap.map(origIdx=>({t:node.opcoes[origIdx],orig:origIdx}));
    }
    currentShuffleMap=opcoes.map(o=>o.orig);
    html+=`<div class="opts" id="optsContainer">`;
    const letras=['A','B','C','D','E','F','G','H'];
    opcoes.forEach((o,i)=>{
      html+=`<div class="opt" data-display="${i}" data-orig="${o.orig}" onclick="selOpt(this,${i})"><span class="ok">${letras[i]||''}</span><span class="ot">${esc(o.t)}</span></div>`;
    });
    html+=`</div>`;
  }else if(isDiss){
    html+=`<div style="margin-bottom:18px">`;
    html+=`<textarea class="diss-area" id="respDissertativa" placeholder="Digite sua resposta aqui..." oninput="dissInput()"></textarea>`;
    html+=`<div class="diss-counter" id="dissCounter">0 / 50 caracteres</div>`;
    html+=`<div class="diss-error" id="dissErr"></div>`;
    html+=`</div>`;
  }

  html+=`<div class="fb" id="fb"></div>`;
  html+=`<div id="resolucaoBox"></div>`;
  html+=`<div class="act-row">`;
  html+=`<button class="btn-chk" id="btnChk" disabled onclick="${isDiss?'verificarDiss()':'verificarMC()'}">${isDiss?'Enviar resposta':'Verificar resposta'}</button>`;
  html+=`<button class="btn-next" id="btnNext" onclick="proximaQuestao()">Próxima →</button>`;
  html+=`</div>`;

  html+=`</div>`; // q-content-side
  html+=`</div>`; // qcard-inner
  html+=`</div>`; // q-card

  area.innerHTML=html;

  if(respostas[nodeAtual]) showSavedAnswer(node,respostas[nodeAtual]);
  else if(tempoMod&&tempoMod.segundos>0) startTimer(tempoMod.segundos);

  window.scrollTo({top:0,behavior:'smooth'});
}

function showResolucao(node){
  if(node.showResolucao&&node.resolucao){
    $('resolucaoBox').innerHTML=`<div class="resolucao"><div class="rt">Resolução</div>${esc(node.resolucao)}</div>`;
  }
}

function paintMCResult(resp,corretas){
  const opts=document.querySelectorAll('.opt');
  opts.forEach(o=>{
    const orig=parseInt(o.dataset.orig);
    const display=parseInt(o.dataset.display);
    o.classList.remove('selected');
    const isCorrect=corretas.includes(orig);
    const isChosen=resp.escolhaDisplay===display;
    if(isChosen&&resp.acertou) o.classList.add('correct');
    else if(isChosen&&!resp.acertou) o.classList.add('wrong');
    else if(isCorrect) o.classList.add('show-correct');
    else o.classList.add('dim');
  });
}

function showSavedAnswer(node,resp){
  answered=true;
  const fb=$('fb');
  if(node.tipo==='multipla_escolha'){
    const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
    paintMCResult(resp,corretas);
    if(fb){fb.style.display='block';fb.className='fb '+(resp.acertou?'ok-fb':'err-fb');fb.innerHTML=resp.acertou?'<strong>Correto!</strong>':'<strong>Incorreto.</strong>'}
  }else if(node.tipo==='dissertativa'){
    const ta=$('respDissertativa');
    if(ta){ta.value=resp.texto||'';ta.disabled=true;ta.classList.add('sent')}
    const cnt=$('dissCounter');if(cnt){const len=(resp.texto||'').replace(/\s/g,'').length;cnt.textContent=len+' / 50 caracteres';cnt.classList.add('ok')}
    if(fb){fb.style.display='block';fb.className='fb ok-fb';fb.innerHTML='<strong>Resposta enviada!</strong> Será avaliada pelo professor.'}
  }
  const chk=$('btnChk');if(chk){chk.disabled=true;chk.style.display='none'}
  $('btnNext').style.display='inline-block';
  showResolucao(node);
}

window.selOpt=function(el,displayIdx){
  if(answered) return;
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  selectedDisplay=displayIdx;
  const chk=$('btnChk'); if(chk) chk.disabled=false;
};

window.verificarMC=function(){
  if(answered||selectedDisplay<0) return;
  answered=true;stopTimer();
  const node=fluxoData.nodes[nodeAtual];
  const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
  const origIdx=currentShuffleMap?currentShuffleMap[selectedDisplay]:selectedDisplay;
  const acertou=corretas.includes(origIdx);
  if(acertou) acertos++; else erros++;
  const resp={tipo:'multipla_escolha',escolhaDisplay:selectedDisplay,escolhaOriginal:origIdx,acertou,shuffleMap:currentShuffleMap,timestamp:new Date().toISOString()};
  respostas[nodeAtual]=resp;
  saveProgress();

  paintMCResult(resp,corretas);
  const fb=$('fb');if(fb){fb.style.display='block';fb.className='fb '+(acertou?'ok-fb':'err-fb');fb.innerHTML=acertou?'<strong>Correto!</strong>':'<strong>Incorreto.</strong>'}
  const chk=$('btnChk');if(chk){chk.disabled=true;chk.style.display='none'}
  $('btnNext').style.display='inline-block';
  showResolucao(node);
  updateBadges();
};

window.dissInput=function(){
  const ta=$('respDissertativa');if(!ta) return;
  const noSpaces=(ta.value||'').replace(/\s/g,'');const len=noSpaces.length;
  const cnt=$('dissCounter');if(cnt){cnt.textContent=len+' / 50 caracteres';cnt.classList.toggle('ok',len>=50)}
  const err=$('dissErr');if(err) err.style.display='none';
  const chk=$('btnChk');if(chk) chk.disabled=len<50;
};

function validateDiss(text){
  const noSpaces=text.replace(/\s/g,'');
  if(noSpaces.length<50) return 'Mínimo de 50 caracteres (sem contar espaços).';
  const rep=/(.)\1{3,}/; if(rep.test(noSpaces)) return 'Texto contém caracteres repetidos em excesso. Escreva uma resposta válida.';
  return null;
}

window.verificarDiss=function(){
  if(answered) return;
  const ta=$('respDissertativa');const texto=(ta.value||'').trim();
  const err=validateDiss(texto);
  if(err){const e=$('dissErr');if(e){e.textContent=err;e.style.display='block'}return}
  answered=true;stopTimer();
  respostas[nodeAtual]={tipo:'dissertativa',texto,timestamp:new Date().toISOString()};
  saveProgress();
  ta.disabled=true;ta.classList.add('sent');
  const fb=$('fb');if(fb){fb.style.display='block';fb.className='fb ok-fb';fb.innerHTML='<strong>Resposta enviada!</strong> Será avaliada pelo professor.'}
  const chk=$('btnChk');if(chk){chk.disabled=true;chk.style.display='none'}
  $('btnNext').style.display='inline-block';
  const node=fluxoData.nodes[nodeAtual];
  showResolucao(node);
};

window.proximaQuestao=function(){
  const nextId=getNextNode(nodeAtual,respostas[nodeAtual]);
  if(!nextId||!fluxoData.nodes[nextId]){showEndScreen();return}
  nodeAtual=nextId;
  if(!fluxoPercorrido.includes(nodeAtual)) fluxoPercorrido.push(nodeAtual);
  saveProgress();renderQuestion();
};

/* ── TIMER ── */
function startTimer(sec){
  timerSec=sec;timerMax=sec;
  $('timerFooter').classList.add('show');
  renderTimer();
  timerInterval=setInterval(()=>{
    timerSec--;
    if(timerSec<=0){stopTimer();timeExpired()}
    else renderTimer();
  },1000);
}
function stopTimer(){if(timerInterval){clearInterval(timerInterval);timerInterval=null}$('timerFooter').classList.remove('show')}
function renderTimer(){
  const m=Math.floor(timerSec/60),s=timerSec%60;
  const v=$('timerVal');
  v.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  v.classList.remove('warn','danger');
  const pct=(timerSec/timerMax)*100;
  if(pct<=25) v.classList.add('danger');
  else if(pct<=50) v.classList.add('warn');
  const bar=$('timerBar');
  bar.style.width=pct+'%';
  bar.style.background=pct<=25?'#ff3b30':(pct<=50?'#ff9500':'#34c759');
}
function timeExpired(){
  if(answered)return;
  const node=fluxoData.nodes[nodeAtual];
  if(!node)return;
  const fb=$('fb');
  if(node.tipo==='multipla_escolha'){
    answered=true;erros++;
    const resp={tipo:'multipla_escolha',escolhaDisplay:-1,escolhaOriginal:-1,acertou:false,shuffleMap:currentShuffleMap,expirou:true,timestamp:new Date().toISOString()};
    respostas[nodeAtual]=resp;
    saveProgress();
    const corretas=Array.isArray(node.correta)?node.correta:[node.correta];
    paintMCResult(resp,corretas);
    if(fb){fb.style.display='block';fb.className='fb err-fb';fb.innerHTML='<strong>Tempo esgotado.</strong>'}
    const chk=$('btnChk');if(chk){chk.disabled=true;chk.style.display='none'}
    $('btnNext').style.display='inline-block';
    showResolucao(node);updateBadges();
  }else if(node.tipo==='dissertativa'){
    answered=true;
    const ta=$('respDissertativa');
    const texto=(ta?.value||'').trim();
    respostas[nodeAtual]={tipo:'dissertativa',texto,expirou:true,timestamp:new Date().toISOString()};
    saveProgress();
    if(ta){ta.disabled=true;ta.classList.add('sent')}
    if(fb){fb.style.display='block';fb.className='fb err-fb';fb.innerHTML='<strong>Tempo esgotado.</strong> Resposta enviada como está.'}
    const chk=$('btnChk');if(chk){chk.disabled=true;chk.style.display='none'}
    $('btnNext').style.display='inline-block';
    showResolucao(node);
  }
}

/* ── END ── */
function showEndScreen(){
  stopTimer();
  $('progressFill').style.width='100%';
  const total=acertos+erros;
  const pct=total>0?Math.round(acertos/total*100):0;
  const msg=pct<50?'Continue praticando. Revise os conceitos e tente de novo.':pct<100?'Bom trabalho! Revise o que errou.':'Excelente! Parabéns!';
  $('questionArea').innerHTML=`
    <div class="end-screen">
      <h1>Atividade Concluída</h1>
      <div class="big-name">${esc(alunoNome)}</div>
      <div class="meta">Turma ${esc(alunoSerie||'—')}</div>
      <div class="div"></div>
      <div class="msg">${msg}</div>
      <div class="stats">
        <div class="rstat" style="background:rgba(48,209,88,.08);border:1px solid rgba(48,209,88,.25)">
          <div class="rstat-label" style="color:var(--green)">Acertos</div>
          <div class="rstat-val" style="color:var(--green)">${acertos}</div>
        </div>
        <div class="rstat" style="background:rgba(255,69,58,.08);border:1px solid rgba(255,69,58,.25)">
          <div class="rstat-label" style="color:var(--red)">Erros</div>
          <div class="rstat-val" style="color:var(--red)">${erros}</div>
        </div>
      </div>
    </div>`;
  saveProgress();
  if(provaActive){provaActive=false;try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}}
}

function saveProgress(){
  if(!alunoId)return;
  db.ref(basePath+'alunos/'+alunoId).update({
    acertos,erros,fluxoPercorrido,respostas,nodeAtual,
    ultimoAcesso:new Date().toISOString()
  });
}
function updateBadges(){
  $('badgeNome').textContent=alunoNome||'Aluno';
  const codigoEl=$('badgeCodigo');
  if(codigoEl){
    codigoEl.textContent = alunoCodigo || '—';
    codigoEl.onclick=()=>{
      if(!alunoCodigo) return;
      try{ navigator.clipboard.writeText(alunoCodigo) }catch(_){}
      const orig=codigoEl.textContent;
      codigoEl.textContent='✓ Copiado';
      setTimeout(()=>{ codigoEl.textContent=alunoCodigo },1200);
    };
  }
}
function updateProgress(){
  const n=Object.keys(respostas).length;
  const pct=totalNodes>0?Math.min(100,(n/totalNodes)*100):0;
  $('progressFill').style.width=pct+'%';
}

init();
</script>
</body>
</html>
