<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classificação — AlquiLab</title>
<script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --bg-page:#0a0a0c;--bg2:#141418;--bg3:#1c1c1f;--card-bg:#141418;
  --text-main:#f5f5f7;--text-light:#8e8e93;
  --accent:#0a84ff;--success:#30d158;--warning:#ffd60a;--error:#ff453a;
  --purple:#bf5af2;--radius:16px;--shadow:0 6px 24px rgba(0,0,0,.55);
  --border-light:#2a2a2e;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{
  background-color:var(--bg-page);
  background-image:
    linear-gradient(rgba(10,132,255,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(10,132,255,.07) 1px,transparent 1px);
  background-size:44px 44px;
  background-attachment:fixed;
  color:var(--text-main);min-height:100vh;padding:40px 20px;padding-bottom:100px;-webkit-user-select:none;user-select:none
}
.container{max-width:1140px;margin:0 auto}

header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:20px}
.titulo-pagina{font-size:2rem;font-weight:700;letter-spacing:-.5px;color:var(--text-main)}
.btn-voltar{text-decoration:none;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:5px;font-size:.9rem;margin-bottom:5px;transition:opacity .2s}
.btn-voltar:hover{opacity:.7}
.filtro-data-container{background:var(--bg2);padding:10px 20px;border-radius:50px;border:1px solid var(--border-light);box-shadow:var(--shadow);display:flex;align-items:center;gap:10px;min-height:48px}
.input-data{border:none;background:transparent;font-size:1rem;color:var(--accent);font-weight:600;cursor:pointer;outline:none;color-scheme:dark}
.input-data::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}

.area-filtros-topo{display:flex;justify-content:flex-start;align-items:stretch;gap:14px;margin-bottom:36px;flex-wrap:wrap}
.dropdown-wrapper{position:relative;display:inline-flex}
.btn-filtro-trigger{background:var(--bg2);color:var(--text-main);padding:12px 22px;border-radius:50px;border:1px solid var(--border-light);font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);display:inline-flex;align-items:center;gap:10px;transition:all .3s;min-width:190px;min-height:48px;justify-content:space-between}
.btn-filtro-trigger:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.6);border-color:#3a3a3e}
.btn-filtro-trigger.ativo{border-color:var(--accent);color:var(--accent)}
.seta-dropdown{width:14px;height:14px;fill:var(--text-light);transition:transform .3s}
.dropdown-wrapper.aberto .seta-dropdown{transform:rotate(180deg);fill:var(--accent)}
.dropdown-menu{position:absolute;top:120%;left:0;width:100%;min-width:200px;background:var(--bg2);border:1px solid var(--border-light);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);padding:10px;z-index:100;opacity:0;visibility:hidden;transform:translateY(-10px);transition:all .2s cubic-bezier(.165,.84,.44,1)}
.dropdown-wrapper.aberto .dropdown-menu{opacity:1;visibility:visible;transform:translateY(0)}
.opcao-item{display:block;width:100%;text-align:left;padding:10px 15px;background:none;border:none;border-radius:8px;font-size:.95rem;color:var(--text-main);cursor:pointer;font-weight:500;transition:background .2s}
.opcao-item:hover{background:var(--bg3);color:var(--accent)}
.opcao-item.selecionado{background:var(--accent);color:#fff}

.grid-resumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.card-resumo{background:var(--card-bg);padding:14px 16px;border:1px solid var(--border-light);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:center;min-height:86px}
.card-titulo{font-size:.75rem;color:var(--text-light);text-transform:uppercase;font-weight:600;letter-spacing:.5px;margin-bottom:4px}
.card-valor{font-size:1.65rem;font-weight:750;color:var(--text-main);letter-spacing:-.5px;line-height:1.1}

.painel-ranking{background:var(--card-bg);border:1px solid var(--border-light);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;min-height:300px}
.tabela-header{display:grid;grid-template-columns:56px 2fr 1.5fr .85fr .85fr 1fr;padding:12px 18px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border-light);font-size:.8rem;font-weight:600;color:var(--text-light);text-transform:uppercase}
.tabela-header>div,.item-aluno>div{display:flex;align-items:center}
.col-pos,.col-serie,.col-nota,.col-erro,.col-tempo{justify-content:center}
.col-aluno{justify-content:flex-start;min-width:0}

.item-aluno{display:grid;grid-template-columns:56px 2fr 1.5fr .85fr .85fr 1fr;padding:14px 18px;align-items:center;border-bottom:1px solid var(--border-light);transition:background .2s;cursor:pointer}
.item-aluno:last-child{border-bottom:none}
.item-aluno:hover{background:rgba(255,255,255,.03)}
.posicao{font-weight:800;color:var(--text-main);font-size:1.05rem}
.medalha{display:inline-flex;align-items:center;justify-content:center;width:22px;margin-right:8px}
.medalha img.emoji{width:18px;height:18px;vertical-align:-2px}
.info-nome{font-weight:600;font-size:1.05rem;color:var(--text-main)}
.info-serie{display:inline-block;padding:4px 12px;border-radius:20px;background:var(--bg3);border:1px solid var(--border-light);color:var(--text-light);font-size:.8rem;font-weight:600;white-space:nowrap}
.info-nota{font-weight:700;color:var(--success)}
.info-erro{font-weight:700;color:var(--error)}
.info-tempo{font-size:.9rem;color:var(--text-light)}
.empty-msg{text-align:center;padding:48px 20px;color:var(--text-light);font-size:.95rem}

@media (max-width:700px){
  .tabela-header{display:none}
  .item-aluno{grid-template-columns:40px 1fr auto auto;grid-template-areas:"pos nome nota erro" "pos serie tempo tempo";gap:5px;padding:15px}
  .posicao{grid-area:pos}.info-nome{grid-area:nome}
  .info-nota{grid-area:nota;text-align:right}
  .info-erro{grid-area:erro;text-align:right;margin-left:10px}
  .info-serie{grid-area:serie}
  .info-tempo{grid-area:tempo;text-align:right;font-size:.8rem}
}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);display:none;justify-content:center;align-items:center;z-index:1000;animation:fadeIn .3s ease}
.modal-overlay.visivel{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modais-wrapper{display:flex;align-items:flex-start;justify-content:center;gap:20px;width:100%;max-width:900px;pointer-events:none;padding:20px}
.modal-box-aluno{background:var(--bg2);padding:30px;border-radius:24px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.7);pointer-events:auto;position:relative;border:1px solid var(--border-light);animation:popIn .3s cubic-bezier(.16,1,.3,1);width:380px;flex-shrink:0;max-height:85vh;overflow-y:auto;color:var(--text-main)}
@keyframes popIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal-titulo{font-size:1.4rem;font-weight:800;margin-bottom:5px;color:var(--text-main);letter-spacing:-.5px}
.modal-sub{font-size:.95rem;color:var(--text-light);margin-bottom:20px}
.modal-close-abs{position:absolute;top:15px;right:15px;background:var(--bg3);border:1px solid var(--border-light);width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--text-light);font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close-abs:hover{background:#2a2a2e;color:var(--text-main)}

.stats-linha{display:flex;justify-content:center;gap:28px;margin-bottom:18px;padding:12px;background:var(--bg3);border:1px solid var(--border-light);border-radius:14px}
.stats-linha .bloco{text-align:center}
.stats-linha .bloco .v{font-size:1.5rem;font-weight:800;line-height:1}
.stats-linha .bloco .l{font-size:.72rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.percurso-titulo{font-size:.78rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 10px;font-weight:700;text-align:left}

.percurso-lista{display:flex;flex-direction:column;gap:8px;text-align:left}
.percurso-item{background:var(--bg3);border:1px solid var(--border-light);border-radius:12px;padding:12px 14px;border-left:4px solid #3a3a3e}
.percurso-item.tipo-multipla_escolha{border-left-color:var(--accent)}
.percurso-item.tipo-dissertativa{border-left-color:var(--purple)}
.percurso-item.tipo-inicio{border-left-color:var(--success)}
.percurso-item.tipo-fim{border-left-color:var(--error)}
.pi-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pi-tipo{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:2px 8px;border-radius:20px;color:#fff;background:#3a3a3e}
.pi-tipo.tipo-multipla_escolha{background:var(--accent)}
.pi-tipo.tipo-dissertativa{background:var(--purple)}
.pi-tipo.tipo-inicio{background:var(--success)}
.pi-tipo.tipo-fim{background:var(--error)}
.pi-q{font-size:.85rem;font-weight:500;margin-bottom:6px;color:var(--text-main)}
.pi-resp{font-size:.82rem;padding:6px 10px;border-radius:8px;display:inline-block}
.pi-resp.acertou{background:rgba(48,209,88,.15);color:var(--success);font-weight:600}
.pi-resp.errou{background:rgba(255,69,58,.15);color:var(--error);font-weight:600}
.pi-resp.dissertativa{background:rgba(10,132,255,.15);color:var(--accent)}
.pi-arrow{text-align:center;color:var(--text-light);font-size:1rem;opacity:.5}

/* Reset history */
.btn-reset{display:none;align-items:center;gap:6px;padding:10px 18px;border-radius:50px;border:1px solid rgba(255,69,58,.35);background:rgba(255,69,58,.08);color:var(--error);font-size:.88rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.btn-reset.visible{display:inline-flex}
.btn-reset:hover{background:var(--error);color:#fff;border-color:var(--error);transform:translateY(-1px)}
.btn-reset svg{width:16px;height:16px}

.reset-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.reset-overlay.show{display:flex}
.reset-box{background:var(--bg2);border:1px solid var(--border-light);border-radius:20px;padding:28px;width:100%;max-width:420px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.7);color:var(--text-main)}
.reset-box h2{font-size:1.2rem;margin-bottom:6px;font-weight:800}
.reset-box p{font-size:.88rem;color:var(--text-light);margin-bottom:18px;line-height:1.5}
.reset-modes{display:flex;gap:8px;margin-bottom:14px}
.reset-mode{flex:1;padding:10px;border:1px solid var(--border-light);border-radius:10px;background:var(--bg3);color:var(--text-main);font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.reset-mode.active{border-color:var(--error);background:rgba(255,69,58,.1);color:var(--error)}
.reset-box input{width:100%;padding:12px 14px;background:var(--bg3);border:1px solid var(--border-light);border-radius:10px;font-size:.95rem;color:var(--text-main);outline:none;font-family:inherit;margin-bottom:10px}
.reset-box input:focus{border-color:var(--accent)}
.reset-err{color:var(--error);font-size:.8rem;min-height:1em;margin-bottom:10px;font-weight:500}
.reset-actions{display:flex;gap:10px}
.reset-actions button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;transition:all .15s}
.reset-cancel{background:var(--bg3);color:var(--text-main);border:1px solid var(--border-light)}
.reset-cancel:hover{background:#26262a}
.reset-confirm{background:var(--error);color:#fff}
.reset-confirm:hover{background:#d63b31;transform:translateY(-1px)}
</style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <a id="linkVoltar" href="index.html" class="btn-voltar">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
        Voltar
      </a>
      <h1 class="titulo-pagina">Classificação</h1>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <button class="btn-reset" id="btnReset" onclick="openResetModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        Resetar histórico
      </button>
      <div class="filtro-data-container">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <input type="date" id="filtroData" class="input-data" title="Filtrar por data (deixe vazio para ver tudo)">
        <button onclick="clearDateFilter()" style="background:none;border:none;color:var(--text-light);cursor:pointer;font-size:1.2rem;line-height:1;padding:0 4px" title="Mostrar todos os dias">×</button>
      </div>
    </div>
  </header>

  <div class="area-filtros-topo">
    <div class="dropdown-wrapper" id="dwAno">
      <button class="btn-filtro-trigger" onclick="toggleDrop('dwAno')">
        <span>Ano: <b id="lblAno">Todos</b></span>
        <svg class="seta-dropdown" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="dropdown-menu" id="menuAno"></div>
    </div>
    <div class="dropdown-wrapper" id="dwTurma">
      <button class="btn-filtro-trigger" onclick="toggleDrop('dwTurma')">
        <span>Turma: <b id="lblTurma">Todas</b></span>
        <svg class="seta-dropdown" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5z"/></svg>
      </button>
      <div class="dropdown-menu" id="menuTurma"></div>
    </div>
  </div>

  <div class="grid-resumo">
    <div class="card-resumo"><div class="card-titulo">Alunos</div><div class="card-valor" id="statTotal">0</div></div>
    <div class="card-resumo"><div class="card-titulo">Média de acertos</div><div class="card-valor" id="statMedia" style="color:var(--success)">0</div></div>
    <div class="card-resumo"><div class="card-titulo">Melhor aluno</div><div class="card-valor" id="statMelhor">-</div></div>
  </div>

  <div class="painel-ranking">
    <div class="tabela-header">
      <div class="col-pos">#</div>
      <div class="col-aluno">Aluno</div>
      <div class="col-serie">Série</div>
      <div class="col-nota">Acertos</div>
      <div class="col-erro">Erros</div>
      <div class="col-tempo">Hora</div>
    </div>
    <ul class="lista-alunos" id="studentList">
      <li class="empty-msg">Aguardando dados...</li>
    </ul>
  </div>
</div>

<div id="resetOverlay" class="reset-overlay">
  <div class="reset-box">
    <h2>Resetar histórico</h2>
    <p>Digite a senha da sua conta para confirmar. Esta ação apenas afeta esta turma.</p>
    <div class="reset-modes">
      <button class="reset-mode active" data-mode="hoje" onclick="setResetMode('hoje',this)">Apenas de hoje</button>
      <button class="reset-mode" data-mode="tudo" onclick="setResetMode('tudo',this)">Todo o histórico</button>
    </div>
    <input type="password" id="resetSenha" placeholder="Senha da sua conta" autocomplete="current-password">
    <div class="reset-err" id="resetErr"></div>
    <div class="reset-actions">
      <button class="reset-cancel" onclick="closeResetModal()">Cancelar</button>
      <button class="reset-confirm" id="btnResetConfirm" onclick="doReset()">Resetar</button>
    </div>
  </div>
</div>

<div id="detailModal" class="modal-overlay">
  <div class="modais-wrapper">
    <div class="modal-box-aluno">
      <button class="modal-close-abs" onclick="closeDetail()">&times;</button>
      <div class="modal-titulo" id="detailNome">Aluno</div>
      <div class="modal-sub" id="detailSub">Série</div>
      <div class="stats-linha">
        <div class="bloco"><div class="v" style="color:var(--success)" id="detailAcertos">0</div><div class="l">Acertos</div></div>
        <div class="bloco"><div class="v" style="color:var(--error)" id="detailErros">0</div><div class="l">Erros</div></div>
      </div>
      <div class="percurso-titulo">Percurso do Aluno</div>
      <div id="detailPath" class="percurso-lista"></div>
    </div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getDatabase,ref,onValue,get,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
import{getAuth,onAuthStateChanged,EmailAuthProvider,reauthenticateWithCredential}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig={apiKey:"AIzaSyAAHGPjuRvE9VpHR469A5RbSEUzxl1zq2w",authDomain:"profbase-5f9b0.firebaseapp.com",databaseURL:"https://profbase-5f9b0-default-rtdb.firebaseio.com",projectId:"profbase-5f9b0",storageBucket:"profbase-5f9b0.firebasestorage.app",messagingSenderId:"826412057766",appId:"1:826412057766:web:729e6e24ce7587417fe067"};
const app=initializeApp(firebaseConfig);const db=getDatabase(app);const auth=getAuth(app);

let currentUser=null,turmaOwnerId=null;
onAuthStateChanged(auth,u=>{
  currentUser=u;
  if(u && turmaOwnerId && u.uid===turmaOwnerId) $('btnReset').classList.add('visible');
});

const $=id=>document.getElementById(id);
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toISO(v){if(!v)return'';try{return new Date(v).toISOString().slice(0,10)}catch(e){return''}}

const urlParams=new URLSearchParams(location.search);
const turmaId=urlParams.get('turmaId')||'';
if(turmaId) $('linkVoltar').href='index.html?turmaId='+encodeURIComponent(turmaId);

const anos=['Todos','5º','6º','7º','8º','9º','1º EM','2º EM','3º EM'];
const turmas=['Todas','A','B','C','D'];
let selAno='Todos',selTurma='Todas';

function buildMenu(id,items,cb,sel){
  const m=$(id);m.innerHTML='';
  items.forEach(v=>{
    const b=document.createElement('button');b.className='opcao-item'+(v===sel?' selecionado':'');
    b.textContent=v;b.onclick=()=>{cb(v);m.parentElement.classList.remove('aberto');renderList()};
    m.appendChild(b);
  });
}
function refreshMenus(){
  buildMenu('menuAno',anos,v=>{selAno=v;$('lblAno').textContent=v},selAno);
  buildMenu('menuTurma',turmas,v=>{selTurma=v;$('lblTurma').textContent=v},selTurma);
}
window.toggleDrop=id=>{
  document.querySelectorAll('.dropdown-wrapper').forEach(d=>{if(d.id!==id) d.classList.remove('aberto')});
  $(id).classList.toggle('aberto');
};
document.addEventListener('click',e=>{
  if(!e.target.closest('.dropdown-wrapper')) document.querySelectorAll('.dropdown-wrapper').forEach(d=>d.classList.remove('aberto'));
});
refreshMenus();

let todosAlunos=[],fluxoData=null;

async function loadFluxo(){
  if(!turmaId) return;
  try{
    const snap=await get(ref(db,'turmas_fluxo/'+turmaId));
    if(!snap.exists()) return;
    const t=snap.val();
    turmaOwnerId=t.criadoPor||null;
    if(currentUser && turmaOwnerId && currentUser.uid===turmaOwnerId) $('btnReset').classList.add('visible');
    if(t.atividadeId&&t.criadoPor){
      const fsnap=await get(ref(db,'fluxos/'+t.criadoPor+'/'+t.atividadeId));
      if(fsnap.exists()) fluxoData=fsnap.val();
    }
  }catch(e){console.error(e)}
}

const filtroData=$('filtroData');
filtroData.addEventListener('change',renderList);
window.clearDateFilter=()=>{filtroData.value='';renderList()};

if(turmaId){
  loadFluxo();
  onValue(ref(db,'turmas_fluxo/'+turmaId+'/alunos'),snap=>{
    todosAlunos=[];
    const data=snap.val();
    if(data) Object.keys(data).forEach(k=>{
      const a=data[k];let hora='--:--';
      if(a.entrouEm){try{hora=new Date(a.entrouEm).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){}}
      todosAlunos.push({id:k,nome:a.nome||'-',serie:a.serie||'-',acertos:a.acertos||0,erros:a.erros||0,hora,data:toISO(a.entrouEm),fluxoPercorrido:a.fluxoPercorrido||[],respostas:a.respostas||{}});
    });
    renderList();
  });
}else{
  $('studentList').innerHTML='<li class="empty-msg">Link inválido — sem turmaId.</li>';
}

function renderList(){
  const dSel=filtroData.value;
  let f=todosAlunos.filter(a=>{
    const bD=!dSel||a.data===dSel;
    const bA=selAno==='Todos'||(a.serie||'').includes(selAno);
    const bT=selTurma==='Todas'||(a.serie||'').endsWith(' '+selTurma);
    return bD&&bA&&bT;
  });
  f.sort((a,b)=>(b.acertos||0)-(a.acertos||0));

  $('statTotal').textContent=f.length;
  const tot=f.reduce((s,a)=>s+(a.acertos||0),0);
  $('statMedia').textContent=f.length?(tot/f.length).toFixed(1):'0';
  $('statMelhor').textContent=f.length?f[0].nome:'-';

  const list=$('studentList');
  if(!f.length){list.innerHTML='<li class="empty-msg">Nenhum aluno para os filtros selecionados.</li>';return}
  const medals=['🥇','🥈','🥉'];
  list.innerHTML=f.map((a,i)=>{
    const med=i<3?`<span class="medalha">${medals[i]}</span>`:'';
    return`<li class="item-aluno" data-id="${a.id}">
      <div class="col-pos posicao">${med}${med?'':i+1}</div>
      <div class="col-aluno info-nome">${esc(a.nome)}</div>
      <div class="col-serie"><span class="info-serie">${esc(a.serie)}</span></div>
      <div class="col-nota info-nota">${a.acertos}</div>
      <div class="col-erro info-erro">${a.erros}</div>
      <div class="col-tempo info-tempo">${a.hora}</div>
    </li>`;
  }).join('');
  list.querySelectorAll('.item-aluno').forEach(el=>{
    el.addEventListener('click',()=>{
      const aluno=f.find(x=>x.id===el.dataset.id);if(aluno) openDetail(aluno);
    });
  });
  if(window.twemoji) twemoji.parse(list);
}

function openDetail(aluno){
  $('detailNome').textContent=aluno.nome;
  $('detailSub').textContent=aluno.serie+' · Entrou às '+aluno.hora;
  $('detailAcertos').textContent=aluno.acertos;
  $('detailErros').textContent=aluno.erros;

  const pathEl=$('detailPath');
  if(!fluxoData||!aluno.fluxoPercorrido||!aluno.fluxoPercorrido.length){
    pathEl.innerHTML='<div style="color:var(--text-light);font-size:.85rem;text-align:center;padding:20px">Sem dados de percurso.</div>';
    $('detailModal').classList.add('visivel');return;
  }
  const tipoLbl={inicio:'Início',multipla_escolha:'Múltipla Escolha',dissertativa:'Dissertativa',fim:'Fim'};
  let html='';
  aluno.fluxoPercorrido.forEach((nid,idx)=>{
    const n=fluxoData.nodes?fluxoData.nodes[nid]:null;if(!n) return;
    const r=aluno.respostas?aluno.respostas[nid]:null;
    html+=`<div class="percurso-item tipo-${n.tipo}">`;
    html+=`<div class="pi-head"><span class="pi-tipo tipo-${n.tipo}">${tipoLbl[n.tipo]||n.tipo}</span></div>`;
    if(n.tipo==='multipla_escolha'||n.tipo==='dissertativa') html+=`<div class="pi-q">${esc(n.pergunta||'')}</div>`;
    if(r){
      if(r.tipo==='multipla_escolha'){
        const oi=(r.escolhaOriginal!=null?r.escolhaOriginal:r.escolha);
        const ot=(n.opcoes&&n.opcoes[oi])?n.opcoes[oi]:'Opção '+(oi+1);
        html+=`<div class="pi-resp ${r.acertou?'acertou':'errou'}">${r.acertou?'✓':'✕'} ${esc(ot)}</div>`;
      }else if(r.tipo==='dissertativa'){
        html+=`<div class="pi-resp dissertativa">"${esc(r.texto||'')}"</div>`;
      }
    }
    html+=`</div>`;
    if(idx<aluno.fluxoPercorrido.length-1) html+=`<div class="pi-arrow">↓</div>`;
  });
  pathEl.innerHTML=html;
  $('detailModal').classList.add('visivel');
}
window.closeDetail=()=>$('detailModal').classList.remove('visivel');
$('detailModal').addEventListener('click',e=>{if(e.target===$('detailModal')) closeDetail()});

/* ── RESET HISTORY (teacher only, password required) ── */
let resetMode='hoje';
window.setResetMode=(m,btn)=>{
  resetMode=m;
  document.querySelectorAll('.reset-mode').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
};
window.openResetModal=()=>{
  if(!currentUser||currentUser.uid!==turmaOwnerId){alert('Apenas o professor que criou esta turma pode resetar.');return}
  $('resetSenha').value='';$('resetErr').textContent='';
  resetMode='hoje';
  document.querySelectorAll('.reset-mode').forEach(b=>b.classList.toggle('active',b.dataset.mode==='hoje'));
  $('resetOverlay').classList.add('show');
  setTimeout(()=>$('resetSenha').focus(),50);
};
window.closeResetModal=()=>$('resetOverlay').classList.remove('show');
$('resetOverlay').addEventListener('click',e=>{if(e.target===$('resetOverlay')) closeResetModal()});
$('resetSenha').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doReset()}});

window.doReset=async()=>{
  const senha=$('resetSenha').value;
  if(!senha){$('resetErr').textContent='Digite sua senha.';return}
  if(!currentUser||!currentUser.email){$('resetErr').textContent='Sessão expirada. Faça login novamente.';return}
  const btn=$('btnResetConfirm');btn.disabled=true;btn.textContent='Verificando...';
  try{
    const cred=EmailAuthProvider.credential(currentUser.email,senha);
    await reauthenticateWithCredential(currentUser,cred);
  }catch(e){
    $('resetErr').textContent='Senha incorreta.';
    btn.disabled=false;btn.textContent='Resetar';
    return;
  }
  try{
    if(resetMode==='tudo'){
      await remove(ref(db,'turmas_fluxo/'+turmaId+'/alunos'));
    }else{
      const hoje=new Date().toISOString().slice(0,10);
      const toRemove=todosAlunos.filter(a=>a.data===hoje);
      await Promise.all(toRemove.map(a=>remove(ref(db,'turmas_fluxo/'+turmaId+'/alunos/'+a.id))));
    }
    closeResetModal();
  }catch(e){
    console.error(e);
    $('resetErr').textContent='Erro ao resetar. Tente novamente.';
  }
  btn.disabled=false;btn.textContent='Resetar';
};
</script>
