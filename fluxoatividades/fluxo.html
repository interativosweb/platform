<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Fluxo — AlquiLab</title>
<style>
/* ── THEME VARS ── */
[data-theme="light"]{--bg:#f5f5f7;--bg2:#fff;--bg3:#fafafa;--text:#1d1d1f;--text2:#86868b;--border:#e5e5ea;--grid-dot:#ccc;--node-shadow:rgba(0,0,0,.08);--canvas-bg:#f0f0f3}
[data-theme="dark"]{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f5f5f7;--text2:#98989d;--border:#48484a;--grid-dot:#555;--node-shadow:rgba(0,0,0,.4);--canvas-bg:#1c1c1e}
:root{--accent:#0071e3;--success:#34c759;--error:#ff3b30;--warn:#ff9500;--purple:#af52de;--teal:#5ac8fa;--pink:#ff2d55;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;user-select:none}

/* ── HEADER ── */
.header{height:50px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;z-index:100;flex-shrink:0}
.btn-h{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:.78rem;font-weight:600;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:4px}
.btn-h:hover{background:var(--bg3)}
.btn-h svg{width:14px;height:14px}
.flow-name-input{flex:1;border:none;background:transparent;font:inherit;font-weight:700;font-size:.95rem;text-align:center;outline:none;color:var(--text);min-width:0}
.flow-name-input:focus{background:var(--bg3);border-radius:6px}
.save-badge{font-size:.7rem;font-weight:600;white-space:nowrap;padding:3px 8px;border-radius:6px}
.save-badge.ok{background:rgba(52,199,89,.12);color:var(--success)}
.save-badge.pending{background:rgba(255,149,0,.12);color:var(--warn)}

/* ── MAIN ── */
.main{flex:1;display:flex;overflow:hidden;position:relative}

/* ── SIDEBAR ── */
.sidebar{width:250px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:50;transition:margin-left .2s}
.sidebar.hidden{margin-left:-250px}
.sb-head{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sb-head h3{font-size:.78rem;text-transform:uppercase;color:var(--text2);letter-spacing:.4px}
.sb-head button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:.72rem;font-weight:600;cursor:pointer}
.sb-tabs{display:flex;border-bottom:1px solid var(--border)}
.sb-tabs button{flex:1;padding:7px;border:none;background:none;font-size:.75rem;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent}
.sb-tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.sb-list{flex:1;overflow-y:auto;padding:6px}
.sb-item{padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:3px;font-size:.82rem;font-weight:500;display:flex;align-items:center;gap:6px;color:var(--text)}
.sb-item:hover{background:var(--bg3)}
.sb-item.active{background:rgba(0,113,227,.1);color:var(--accent)}
.sb-item .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.sb-empty{padding:16px;text-align:center;color:var(--text2);font-size:.82rem}

/* ── CANVAS ── */
.canvas-wrap{flex:1;overflow:hidden;position:relative;background:var(--canvas-bg);cursor:grab}
.canvas-wrap.grabbing{cursor:grabbing}
.canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0;width:8000px;height:6000px;background-image:radial-gradient(circle,var(--grid-dot) 1px,transparent 1px);background-size:24px 24px}
.canvas-inner svg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.canvas-inner svg path.conn{fill:none;stroke-width:2.5;pointer-events:stroke;cursor:pointer}
.canvas-inner svg path.conn:hover{stroke-width:4}
.canvas-inner svg path.conn-temp{fill:none;stroke:#999;stroke-width:2;stroke-dasharray:6 4;opacity:.5}

/* ── NODES ── */
.node{position:absolute;min-width:200px;max-width:260px;background:var(--bg2);border-radius:var(--radius);box-shadow:0 2px 10px var(--node-shadow);border:2px solid transparent;z-index:10;cursor:grab;transition:box-shadow .12s,border-color .12s}
.node:hover{box-shadow:0 4px 18px var(--node-shadow)}
.node.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.18)}
.node.dragging{cursor:grabbing;z-index:20;box-shadow:0 8px 28px var(--node-shadow)}

.node-head{padding:7px 10px;border-radius:10px 10px 0 0;display:flex;align-items:center;justify-content:space-between;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:#fff}
.node-head .btn-del{background:none;border:none;color:rgba(255,255,255,.7);font-size:.95rem;cursor:pointer;line-height:1;padding:0 2px}
.node-head .btn-del:hover{color:#fff}

.node-body{padding:8px 10px;font-size:.8rem;color:var(--text);line-height:1.35;min-height:24px;cursor:pointer}
.node-body em{color:var(--text2);font-style:italic}
.node-body img{max-width:100%;max-height:80px;border-radius:6px;margin-top:4px;object-fit:contain}

/* ── PORTS (lateral) ── */
.port{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg2);z-index:15;cursor:crosshair;transition:transform .1s}
.port:hover{transform:scale(1.35)}
.port-in{top:50%;left:-6px;transform:translateY(-50%);background:#aaa}
.port-in:hover{background:var(--accent);transform:translateY(-50%) scale(1.35)}
.port-out{top:50%;right:-6px;transform:translateY(-50%)}
.port-out-top{top:20%;right:-6px;transform:translateY(-50%)}
.port-out-bot{top:80%;right:-6px;transform:translateY(-50%)}
/* label inside node for multi-port */
.port-label{position:absolute;right:18px;font-size:.55rem;font-weight:700;text-transform:uppercase;color:var(--text2);pointer-events:none;white-space:nowrap}
.port-label-top{top:calc(20% - 5px)}
.port-label-bot{top:calc(80% - 5px)}

/* ── CONTEXT MENU ── */
.ctx-menu{position:absolute;z-index:200;background:var(--bg2);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.15);padding:4px;min-width:160px;display:none}
.ctx-menu.show{display:block}
.ctx-item{padding:7px 12px;font-size:.8rem;cursor:pointer;border-radius:6px;display:flex;align-items:center;gap:8px;color:var(--text)}
.ctx-item:hover{background:var(--bg3)}
.ctx-item.danger{color:var(--error)}
.ctx-sep{height:1px;background:var(--border);margin:3px 8px}
.ctx-colors{display:flex;gap:4px;padding:6px 10px;flex-wrap:wrap}
.ctx-color{width:20px;height:20px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .1s}
.ctx-color:hover{transform:scale(1.2)}
.ctx-color.sel{border-color:var(--text)}

/* ── TOOLBAR ── */
.toolbar{height:48px;background:var(--bg2);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;flex-shrink:0;z-index:100}
.btn-tool{display:flex;align-items:center;gap:5px;padding:6px 14px;border-radius:50px;border:none;font-size:.78rem;font-weight:600;cursor:pointer;color:#fff;transition:transform .12s,opacity .12s}
.btn-tool:hover{transform:scale(1.04)}
.btn-tool:active{transform:scale(.97)}
.btn-tool.t-mc{background:var(--accent)}
.btn-tool.t-di{background:var(--purple)}
.btn-tool.t-fi{background:var(--error)}
.btn-ghost{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:.75rem;cursor:pointer;color:var(--text);font-weight:600;display:flex;align-items:center;gap:4px}
.btn-ghost:hover{background:var(--bg3)}
.zoom-display{font-size:.72rem;font-weight:700;color:var(--text2);min-width:42px;text-align:center}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.show{display:flex}
.modal{background:var(--bg2);border-radius:16px;padding:24px;width:92%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);animation:popIn .2s ease;max-height:85vh;overflow-y:auto;color:var(--text)}
@keyframes popIn{from{transform:scale(.93);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{font-size:1.05rem;margin-bottom:14px}
.modal label{display:block;font-size:.72rem;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px;margin-top:10px}
.modal input[type=text],.modal textarea,.modal select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;outline:none;font-family:inherit;background:var(--bg3);color:var(--text)}
.modal input:focus,.modal textarea:focus,.modal select:focus{border-color:var(--accent)}
.modal textarea{resize:vertical;min-height:60px}
.modal .opts-grid{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.modal .opt-row{display:flex;align-items:center;gap:6px}
.modal .opt-row input[type=text]{flex:1}
.modal .opt-row input[type=radio]{accent-color:var(--success);width:16px;height:16px}
.modal .opt-row .rm{background:none;border:none;color:var(--error);cursor:pointer;font-size:1rem;padding:0 4px}
.modal .btn-add-opt{background:none;border:1px dashed var(--border);border-radius:8px;padding:5px;font-size:.78rem;color:var(--accent);cursor:pointer;margin-top:5px;width:100%;font-weight:600}
.modal .check-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:.85rem}
.modal .check-row input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.modal .btns{display:flex;gap:8px;margin-top:18px}
.modal .btns button{flex:1;padding:11px;border:none;border-radius:10px;font-size:.92rem;font-weight:600;cursor:pointer}
.modal .btn-cancel{background:var(--bg3);color:var(--text)}
.modal .btn-save{background:var(--accent);color:#fff}

/* ── DROP ZONE ── */
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:16px;text-align:center;color:var(--text2);font-size:.8rem;cursor:pointer;transition:border-color .2s,background .2s;margin-top:6px}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:rgba(0,113,227,.04)}
.drop-zone img{max-width:100%;max-height:120px;border-radius:8px;margin-top:6px;object-fit:contain}

/* ── AUTH ── */
.auth-warn{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px;color:var(--text)}
.auth-warn h2{font-size:1.3rem;margin-bottom:8px}
.auth-warn p{color:var(--text2);margin-bottom:18px}
.auth-warn a{background:var(--accent);color:#fff;text-decoration:none;padding:11px 28px;border-radius:50px;font-weight:600}

@media(max-width:700px){.sidebar{width:210px}.node{min-width:160px;max-width:200px}.toolbar{gap:4px}.btn-tool{padding:5px 10px;font-size:.72rem}}
</style>
</head>
<body>

<div id="authWarn" class="auth-warn" style="display:none">
  <h2>Acesso Restrito</h2>
  <p>Faça login na plataforma para acessar o editor.</p>
  <a href="../Plataforma.html">Fazer Login</a>
</div>

<!-- HEADER -->
<div class="header">
  <button class="btn-h" onclick="history.back()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg> Voltar</button>
  <input id="flowNameInput" class="flow-name-input" placeholder="Nome do fluxo..." spellcheck="false">
  <span id="saveBadge" class="save-badge ok">Salvo</span>
  <button class="btn-h" id="btnSidebarToggle">Fluxos</button>
  <button class="btn-h" id="btnTheme" title="Modo claro/escuro">&#9790;</button>
</div>

<!-- MAIN -->
<div class="main">
  <div id="sidebar" class="sidebar hidden">
    <div class="sb-head"><h3>Fluxos</h3><button id="btnNewFlow">+ Novo</button></div>
    <div class="sb-tabs"><button class="active" data-tab="meus">Meus</button><button data-tab="admin">Pré-criados</button></div>
    <div id="sbList" class="sb-list"><div class="sb-empty">Carregando...</div></div>
  </div>

  <div id="canvasWrap" class="canvas-wrap">
    <div id="canvasInner" class="canvas-inner">
      <svg id="svgLayer"></svg>
      <div id="nodesLayer"></div>
    </div>
  </div>
</div>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="btn-ghost" id="btnToggleSB">&#9776;</button>
  <button class="btn-tool t-mc" onclick="addNode('multipla_escolha')">+ Múlt. Escolha</button>
  <button class="btn-tool t-di" onclick="addNode('dissertativa')">+ Dissertativa</button>
  <button class="btn-tool t-fi" onclick="addNode('fim')">+ Fim</button>
  <span style="flex:1"></span>
  <button class="btn-ghost" onclick="zoomBy(-0.1)">−</button>
  <span class="zoom-display" id="zoomDisplay">100%</span>
  <button class="btn-ghost" onclick="zoomBy(0.1)">+</button>
</div>

<!-- CONTEXT MENU -->
<div id="ctxMenu" class="ctx-menu">
  <div class="ctx-item" data-act="edit">&#9998; Editar</div>
  <div class="ctx-item" data-act="comment">&#128172; Comentário</div>
  <div class="ctx-sep"></div>
  <div style="padding:4px 10px;font-size:.68rem;font-weight:600;color:var(--text2);text-transform:uppercase">Cor</div>
  <div class="ctx-colors" id="ctxColors"></div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" data-act="delete">&#128465; Excluir</div>
</div>

<!-- EDIT MODAL -->
<div id="editModal" class="modal-overlay">
  <div class="modal">
    <h2 id="editTitle">Editar Questão</h2>
    <label>Pergunta</label>
    <textarea id="editPergunta" rows="3" placeholder="Digite a pergunta..."></textarea>

    <div id="secMC">
      <label>Opções de Resposta <small style="color:var(--text2)">(marque a correta)</small></label>
      <div id="editOpts" class="opts-grid"></div>
      <button class="btn-add-opt" id="btnAddOpt">+ Adicionar opção</button>
    </div>

    <label>Imagem <small style="color:var(--text2)">(máx 800KB — arraste ou clique)</small></label>
    <div class="drop-zone" id="dropZone">
      Arraste uma imagem aqui ou clique para selecionar
      <input type="file" id="fileInput" accept="image/*" style="display:none">
    </div>

    <label>Resolução para o aluno <small style="color:var(--text2)">(opcional)</small></label>
    <textarea id="editResolucao" rows="2" placeholder="Explicação exibida após responder..."></textarea>

    <div class="check-row">
      <input type="checkbox" id="editShowResolucao">
      <span>Exibir resolução ao aluno após responder</span>
    </div>

    <div class="btns">
      <button class="btn-cancel" onclick="closeEditModal()">Cancelar</button>
      <button class="btn-save" onclick="saveNodeEdit()">Salvar</button>
    </div>
  </div>
</div>

<!-- COMMENT MODAL -->
<div id="commentModal" class="modal-overlay">
  <div class="modal" style="max-width:380px">
    <h2>Comentário</h2>
    <textarea id="commentText" rows="3" placeholder="Nota ou observação sobre este bloco..."></textarea>
    <div class="btns">
      <button class="btn-cancel" onclick="closeCommentModal()">Cancelar</button>
      <button class="btn-save" onclick="saveComment()">Salvar</button>
    </div>
  </div>
</div>

<!-- NEW FLOW MODAL -->
<div id="newFlowModal" class="modal-overlay">
  <div class="modal" style="max-width:360px">
    <h2>Novo Fluxo</h2>
    <label>Nome da atividade</label>
    <input id="newFlowName" type="text" placeholder="Ex: Semelhança de Triângulos">
    <div class="btns">
      <button class="btn-cancel" onclick="closeNewFlowModal()">Cancelar</button>
      <button class="btn-save" onclick="createNewFlow()">Criar</button>
    </div>
  </div>
</div>

<!-- SCRIPTS -->
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getDatabase,ref,set,get,update,remove}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const fbConf={apiKey:"AIzaSyAAHGPjuRvE9VpHR469A5RbSEUzxl1zq2w",authDomain:"profbase-5f9b0.firebaseapp.com",databaseURL:"https://profbase-5f9b0-default-rtdb.firebaseio.com",projectId:"profbase-5f9b0",storageBucket:"profbase-5f9b0.firebasestorage.app",messagingSenderId:"826412057766",appId:"1:826412057766:web:729e6e24ce7587417fe067"};
const app=initializeApp(fbConf),auth=getAuth(app),db=getDatabase(app);
const ADM='gilbertofernandessc@gmail.com';

/* ── ELEMENTS ── */
const $=id=>document.getElementById(id);
const wrap=$('canvasWrap'),inner=$('canvasInner'),svgL=$('svgLayer'),nodesL=$('nodesLayer');

/* ── PALETTE ── */
const COLORS=['#0071e3','#34c759','#ff3b30','#ff9500','#af52de','#5ac8fa','#ff2d55','#8e8e93','#30d158','#007aff','#ff6482','#ffcc00'];

/* ── STATE ── */
let user=null,flowId=null,flow={nome:'',nodes:{}};
let selNode=null,editNodeId=null,ctxNodeId=null;
let myFlows=[],adminFlows=[],sbTab='meus';
let saveT=null,dirty=false;

// Pan & Zoom
let zoom=1,panX=0,panY=0;
let isPanning=false,panStart={x:0,y:0},panOrig={x:0,y:0};

// Drag nodes
let dragId=null,dragMoved=false,dragStart={x:0,y:0},dragNStart={x:0,y:0};

// Connecting
let isConn=false,connFrom=null,tempPath=null;

/* ── UTILS ── */
function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
const typeLabel={inicio:'Início',multipla_escolha:'Múlt. Escolha',dissertativa:'Dissertativa',fim:'Fim'};
const defaultColor={inicio:'#34c759',multipla_escolha:'#0071e3',dissertativa:'#af52de',fim:'#ff3b30'};

/* ── THEME ── */
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('fluxo_theme',t);$('btnTheme').textContent=t==='dark'?'☀':'☾'}
$('btnTheme').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
setTheme(localStorage.getItem('fluxo_theme')||'light');

/* ══════════════ ZOOM & PAN ══════════════ */
function applyTransform(){
  inner.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;
  $('zoomDisplay').textContent=Math.round(zoom*100)+'%';
}
window.zoomBy=function(d){zoom=clamp(zoom+d,0.2,3);applyTransform()};

// Mouse wheel zoom (Alt+Scroll)
wrap.addEventListener('wheel',e=>{
  e.preventDefault();
  const rect=wrap.getBoundingClientRect();
  const mx=e.clientX-rect.left, my=e.clientY-rect.top;
  const oldZ=zoom;
  const delta=e.deltaY>0?-0.08:0.08;
  zoom=clamp(zoom+delta,0.2,3);
  // Zoom toward cursor
  panX=mx-(mx-panX)*(zoom/oldZ);
  panY=my-(my-panY)*(zoom/oldZ);
  applyTransform();
},{passive:false});

// Pan (click + drag on background)
wrap.addEventListener('mousedown',e=>{
  if(e.target===wrap||e.target===inner||e.target===svgL||e.target===nodesL){
    // Check if not on a node
    if(!e.target.closest('.node')&&!e.target.closest('.port')){
      isPanning=true;
      panStart={x:e.clientX,y:e.clientY};
      panOrig={x:panX,y:panY};
      wrap.classList.add('grabbing');
      e.preventDefault();
    }
  }
});
window.addEventListener('mousemove',e=>{
  if(isPanning){
    panX=panOrig.x+(e.clientX-panStart.x);
    panY=panOrig.y+(e.clientY-panStart.y);
    applyTransform();
  }
  if(isConn&&tempPath){
    const from=getPortPos(connFrom.nodeId,connFrom.side);
    if(from){
      const pt=clientToCanvas(e.clientX,e.clientY);
      tempPath.setAttribute('d',bezier(from.x,from.y,pt.x,pt.y,connFrom.side==='right'));
    }
  }
  if(dragId){
    const dx=(e.clientX-dragStart.x)/zoom;
    const dy=(e.clientY-dragStart.y)/zoom;
    if(!dragMoved&&(Math.abs(dx)+Math.abs(dy))>3) dragMoved=true;
    if(dragMoved){
      const n=flow.nodes[dragId];
      n.x=clamp(dragNStart.x+dx,0,7800);
      n.y=clamp(dragNStart.y+dy,0,5800);
      const el=nodesL.querySelector(`[data-id="${dragId}"]`);
      if(el){el.style.left=n.x+'px';el.style.top=n.y+'px';el.classList.add('dragging')}
      renderConns();
    }
  }
});
window.addEventListener('mouseup',e=>{
  if(isPanning){isPanning=false;wrap.classList.remove('grabbing')}
  if(dragId){
    const el=nodesL.querySelector(`[data-id="${dragId}"]`);
    if(el) el.classList.remove('dragging');
    if(dragMoved) markDirty();
    setTimeout(()=>{dragMoved=false},30);
    dragId=null;
  }
  if(isConn){
    // Check if dropped on a port-in
    const pin=e.target.closest('.port-in');
    if(pin){
      const tid=pin.dataset.nodeId;
      if(tid!==connFrom.nodeId){
        if(!flow.nodes[connFrom.nodeId].conexoes) flow.nodes[connFrom.nodeId].conexoes={};
        flow.nodes[connFrom.nodeId].conexoes[connFrom.portKey]=tid;
        renderConns();markDirty();
      }
    }
    if(tempPath){tempPath.remove();tempPath=null}
    isConn=false;connFrom=null;
  }
});

function clientToCanvas(cx,cy){
  const rect=wrap.getBoundingClientRect();
  return{x:(cx-rect.left-panX)/zoom,y:(cy-rect.top-panY)/zoom};
}

/* ══════════════ AUTH ══════════════ */
onAuthStateChanged(auth,u=>{
  if(!u){$('authWarn').style.display='flex';return}
  $('authWarn').style.display='none';
  user=u;
  loadLists();
  const urlId=new URLSearchParams(location.search).get('id');
  if(urlId) loadFlow(urlId); else showSB();
});

/* ══════════════ FLOW CRUD ══════════════ */
async function loadLists(){
  try{const s=await get(ref(db,'fluxos/'+user.uid));myFlows=[];if(s.exists())s.forEach(c=>myFlows.push({id:c.key,...c.val()}))}catch(e){myFlows=[]}
  try{const s=await get(ref(db,'fluxos_admin'));adminFlows=[];if(s.exists())s.forEach(c=>adminFlows.push({id:c.key,...c.val()}))}catch(e){adminFlows=[]}
  renderSB();
}
function renderSB(){
  const items=sbTab==='meus'?myFlows:adminFlows;
  $('sbList').innerHTML=items.length?items.map(f=>`<div class="sb-item ${f.id===flowId?'active':''}" data-id="${f.id}"><span class="dot" style="background:${f.id===flowId?'var(--accent)':'#c7c7cc'}"></span>${esc(f.nome||'Sem nome')}</div>`).join(''):`<div class="sb-empty">${sbTab==='meus'?'Nenhum fluxo.':'Nenhum pré-criado.'}</div>`;
  $('sbList').querySelectorAll('.sb-item').forEach(el=>el.onclick=()=>sbTab==='meus'?loadFlow(el.dataset.id):copyAdminFlow(el.dataset.id));
}
async function loadFlow(fid){
  try{
    const s=await get(ref(db,'fluxos/'+user.uid+'/'+fid));
    if(!s.exists()){alert('Fluxo não encontrado.');return}
    const d=s.val();flowId=fid;
    flow={nome:d.nome||'',nodes:d.nodes||{}};
    $('flowNameInput').value=flow.nome;
    renderAll();history.replaceState(null,'','?id='+fid);renderSB();
    // Center on start node
    const st=Object.values(flow.nodes).find(n=>n.tipo==='inicio');
    if(st){panX=-st.x*zoom+wrap.clientWidth/2;panY=-st.y*zoom+wrap.clientHeight/2;applyTransform()}
  }catch(e){console.error(e);alert('Erro ao carregar.')}
}
async function copyAdminFlow(fid){
  try{
    const s=await get(ref(db,'fluxos_admin/'+fid));if(!s.exists())return;
    const d=s.val();const nid='fl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    await set(ref(db,'fluxos/'+user.uid+'/'+nid),{nome:(d.nome||'')+'(cópia)',nodes:d.nodes||{},criadoEm:new Date().toISOString(),atualizadoEm:new Date().toISOString()});
    await loadLists();loadFlow(nid);
  }catch(e){console.error(e);alert('Erro.')}
}
async function saveFlow(){
  if(!flowId||!user)return;
  $('saveBadge').textContent='Salvando...';$('saveBadge').className='save-badge pending';
  try{
    await update(ref(db,'fluxos/'+user.uid+'/'+flowId),{nome:flow.nome,nodes:flow.nodes||{},atualizadoEm:new Date().toISOString()});
    $('saveBadge').textContent='Salvo';$('saveBadge').className='save-badge ok';dirty=false;
  }catch(e){console.error(e);$('saveBadge').textContent='Erro';$('saveBadge').className='save-badge pending'}
}
function markDirty(){dirty=true;$('saveBadge').textContent='...';$('saveBadge').className='save-badge pending';clearTimeout(saveT);saveT=setTimeout(saveFlow,1200)}

$('flowNameInput').addEventListener('input',e=>{flow.nome=e.target.value;markDirty()});

/* ══════════════ ADD NODE ══════════════ */
window.addNode=function(tipo){
  if(!flowId){alert('Crie ou abra um fluxo primeiro.');return}
  const id=uid();
  const center=clientToCanvas(wrap.clientWidth/2,wrap.clientHeight/2);
  const n={id,tipo,x:center.x-100,y:center.y-30,cor:defaultColor[tipo],conexoes:{}};
  if(tipo==='multipla_escolha'){n.pergunta='';n.opcoes=['','','',''];n.correta=0;n.resolucao='';n.showResolucao=false}
  if(tipo==='dissertativa'){n.pergunta='';n.resolucao='';n.showResolucao=false}
  flow.nodes[id]=n;renderNode(n);renderConns();markDirty();selectN(id);
  if(tipo!=='fim'&&tipo!=='inicio') openEditModal(id);
};

/* ══════════════ RENDER ══════════════ */
function renderAll(){nodesL.innerHTML='';Object.values(flow.nodes).forEach(renderNode);renderConns()}

function renderNode(n){
  let el=nodesL.querySelector(`[data-id="${n.id}"]`);if(el)el.remove();
  el=document.createElement('div');
  el.className='node'+(selNode===n.id?' selected':'');
  el.dataset.id=n.id;
  el.style.left=n.x+'px';el.style.top=n.y+'px';

  const color=n.cor||defaultColor[n.tipo]||'#8e8e93';

  // Input port (left) — not for inicio
  if(n.tipo!=='inicio'){
    const pi=document.createElement('div');pi.className='port port-in';pi.dataset.nodeId=n.id;pi.dataset.port='input';el.appendChild(pi);
  }

  // Header
  const head=document.createElement('div');head.className='node-head';head.style.background=color;
  head.innerHTML=`<span>${typeLabel[n.tipo]||n.tipo}</span>`;
  if(n.tipo!=='inicio'){const bd=document.createElement('button');bd.className='btn-del';bd.textContent='×';bd.onclick=e=>{e.stopPropagation();deleteNode(n.id)};head.appendChild(bd)}
  el.appendChild(head);

  // Body
  const body=document.createElement('div');body.className='node-body';
  if(n.tipo==='inicio') body.innerHTML='<em>Ponto de partida</em>';
  else if(n.tipo==='fim') body.innerHTML='<em>Fim da atividade</em>';
  else{
    const txt=n.pergunta||'';
    let inner=txt?esc(txt).slice(0,70)+(txt.length>70?'...':''):'<em>Clique duplo para editar</em>';
    if(n.imgData) inner+=`<img src="${n.imgData}">`;
    body.innerHTML=inner;
  }
  body.ondblclick=e=>{e.stopPropagation();if(n.tipo!=='inicio'&&n.tipo!=='fim')openEditModal(n.id)};
  el.appendChild(body);

  // Comment indicator
  if(n.comentario){
    const ci=document.createElement('div');
    ci.style.cssText='padding:3px 8px;font-size:.65rem;color:var(--text2);border-top:1px solid var(--border);font-style:italic';
    ci.textContent='💬 '+n.comentario.slice(0,40);
    el.appendChild(ci);
  }

  // Output ports (right side)
  if(n.tipo==='inicio'){
    const p=mk_port(n.id,'proximo','right','50%',color);el.appendChild(p);
  }else if(n.tipo==='multipla_escolha'){
    const pa=mk_port(n.id,'acerto','right','30%','#34c759');
    const pe=mk_port(n.id,'erro','right','70%','#ff3b30');
    el.appendChild(pa);el.appendChild(pe);
    // Labels
    const la=document.createElement('span');la.className='port-label';la.style.top='calc(30% - 5px)';la.style.right='18px';la.textContent='Acerto';el.appendChild(la);
    const le=document.createElement('span');le.className='port-label';le.style.top='calc(70% - 5px)';le.style.right='18px';le.textContent='Erro';el.appendChild(le);
  }else if(n.tipo==='dissertativa'){
    const p=mk_port(n.id,'concluido','right','50%',n.cor||'#af52de');el.appendChild(p);
  }
  // fim: no output

  // Events
  el.onmousedown=e=>{
    if(e.target.closest('.port')||e.target.closest('.btn-del'))return;
    dragId=n.id;dragMoved=false;dragStart={x:e.clientX,y:e.clientY};dragNStart={x:n.x,y:n.y};e.preventDefault();
  };
  el.onclick=e=>{if(!dragMoved)selectN(n.id)};
  el.oncontextmenu=e=>{e.preventDefault();showCtx(n.id,e.clientX,e.clientY)};

  nodesL.appendChild(el);
}

function mk_port(nodeId,key,side,topPct,color){
  const p=document.createElement('div');
  p.className='port port-out';
  p.style.top=topPct;p.style.right='-6px';p.style.left='auto';p.style.transform='translateY(-50%)';
  p.style.background=color;
  p.dataset.nodeId=nodeId;p.dataset.portKey=key;p.dataset.side='right';
  p.onmousedown=e=>{
    e.stopPropagation();e.preventDefault();
    isConn=true;connFrom={nodeId,portKey:key,side:'right'};
    tempPath=document.createElementNS('http://www.w3.org/2000/svg','path');
    tempPath.classList.add('conn-temp');svgL.appendChild(tempPath);
  };
  return p;
}

function deleteNode(nid){
  Object.values(flow.nodes).forEach(n=>{if(n.conexoes)Object.keys(n.conexoes).forEach(k=>{if(n.conexoes[k]===nid)delete n.conexoes[k]})});
  delete flow.nodes[nid];if(selNode===nid)selNode=null;renderAll();markDirty();
}
function selectN(nid){selNode=nid;nodesL.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.id===nid))}

/* ══════════════ CONNECTIONS ══════════════ */
function renderConns(){
  svgL.innerHTML=`<defs>
    <marker id="aG" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#34c759"/></marker>
    <marker id="aR" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#ff3b30"/></marker>
    <marker id="aB" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#0071e3"/></marker>
    <marker id="aP" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#af52de"/></marker>
    <marker id="aDef" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#8e8e93"/></marker>
  </defs>`;
  Object.values(flow.nodes).forEach(n=>{
    if(!n.conexoes)return;
    Object.entries(n.conexoes).forEach(([port,tid])=>{
      if(!tid||!flow.nodes[tid])return;
      const from=getPortPos(n.id,port);
      const to=getPortPos(tid,'input');
      if(!from||!to)return;
      let stroke,marker;
      if(port==='acerto'){stroke='#34c759';marker='url(#aG)'}
      else if(port==='erro'){stroke='#ff3b30';marker='url(#aR)'}
      else if(port==='proximo'){stroke='#0071e3';marker='url(#aB)'}
      else if(port==='concluido'){stroke='#af52de';marker='url(#aP)'}
      else{stroke='#8e8e93';marker='url(#aDef)'}
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.classList.add('conn');
      path.setAttribute('d',bezier(from.x,from.y,to.x,to.y,true));
      path.setAttribute('stroke',stroke);path.setAttribute('marker-end',marker);
      path.dataset.from=n.id;path.dataset.port=port;
      path.style.pointerEvents='stroke';
      path.onclick=()=>{if(confirm('Remover conexão?')){delete flow.nodes[n.id].conexoes[port];renderConns();markDirty()}};
      svgL.appendChild(path);
    });
  });
}

function getPortPos(nid,portKey){
  const el=nodesL.querySelector(`[data-id="${nid}"]`);if(!el)return null;
  const nx=parseFloat(el.style.left),ny=parseFloat(el.style.top);
  const w=el.offsetWidth,h=el.offsetHeight;
  if(portKey==='input') return{x:nx,y:ny+h/2};
  const pEl=el.querySelector(`.port-out[data-port-key="${portKey}"]`);
  if(pEl) return{x:nx+w,y:ny+parseFloat(pEl.style.top)/100*h};
  // Fallback by position percentage
  if(portKey==='proximo'||portKey==='concluido') return{x:nx+w,y:ny+h*0.5};
  if(portKey==='acerto') return{x:nx+w,y:ny+h*0.3};
  if(portKey==='erro') return{x:nx+w,y:ny+h*0.7};
  return{x:nx+w,y:ny+h/2};
}

function bezier(x1,y1,x2,y2,horiz){
  const d=Math.max(60,Math.abs(x2-x1)*0.4);
  return`M${x1} ${y1} C${x1+d} ${y1},${x2-d} ${y2},${x2} ${y2}`;
}

/* ══════════════ CONTEXT MENU ══════════════ */
function showCtx(nid,cx,cy){
  ctxNodeId=nid;
  const m=$('ctxMenu');
  m.style.left=cx+'px';m.style.top=cy+'px';
  // Colors
  const n=flow.nodes[nid];
  $('ctxColors').innerHTML=COLORS.map(c=>`<div class="ctx-color ${n.cor===c?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');
  $('ctxColors').querySelectorAll('.ctx-color').forEach(el=>el.onclick=()=>{
    flow.nodes[ctxNodeId].cor=el.dataset.c;renderNode(flow.nodes[ctxNodeId]);renderConns();markDirty();hideCtx();
  });
  m.classList.add('show');
  setTimeout(()=>document.addEventListener('click',hideCtxOnClick,{once:true}),10);
}
function hideCtx(){$('ctxMenu').classList.remove('show');ctxNodeId=null}
function hideCtxOnClick(){hideCtx()}

$('ctxMenu').querySelectorAll('.ctx-item').forEach(el=>el.onclick=()=>{
  const act=el.dataset.act;if(!ctxNodeId)return;
  if(act==='edit'&&flow.nodes[ctxNodeId].tipo!=='inicio'&&flow.nodes[ctxNodeId].tipo!=='fim') openEditModal(ctxNodeId);
  if(act==='comment') openCommentModal(ctxNodeId);
  if(act==='delete'&&flow.nodes[ctxNodeId].tipo!=='inicio') deleteNode(ctxNodeId);
  hideCtx();
});

/* ══════════════ EDIT MODAL ══════════════ */
function openEditModal(nid){
  const n=flow.nodes[nid];if(!n)return;
  editNodeId=nid;
  $('editTitle').textContent='Editar: '+typeLabel[n.tipo];
  $('editPergunta').value=n.pergunta||'';
  $('editResolucao').value=n.resolucao||'';
  $('editShowResolucao').checked=!!n.showResolucao;

  // Image
  const dz=$('dropZone');
  if(n.imgData){dz.innerHTML=`<img src="${n.imgData}"><br><small>Clique ou arraste para trocar</small><input type="file" id="fileInput" accept="image/*" style="display:none">`}
  else{dz.innerHTML='Arraste uma imagem aqui ou clique para selecionar<input type="file" id="fileInput" accept="image/*" style="display:none">'}
  setupDropZone();

  // MC options
  $('secMC').style.display=n.tipo==='multipla_escolha'?'block':'none';
  if(n.tipo==='multipla_escolha') renderOptsEdit(n.opcoes||['','','',''],n.correta??0);

  $('editModal').classList.add('show');
  $('editPergunta').focus();
}
window.closeEditModal=()=>{$('editModal').classList.remove('show');editNodeId=null};

function renderOptsEdit(opcoes,correta){
  const c=$('editOpts');c.innerHTML='';
  opcoes.forEach((o,i)=>{
    const r=document.createElement('div');r.className='opt-row';
    r.innerHTML=`<input type="radio" name="ec" value="${i}" ${i===correta?'checked':''}><input type="text" value="${esc(o)}" placeholder="Opção ${i+1}" data-i="${i}"><button class="rm" data-i="${i}">×</button>`;
    c.appendChild(r);
  });
  c.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{opcoes.splice(parseInt(b.dataset.i),1);if(correta>=opcoes.length)correta=Math.max(0,opcoes.length-1);renderOptsEdit(opcoes,correta)});
}
$('btnAddOpt').onclick=()=>{
  const inputs=$('editOpts').querySelectorAll('input[type=text]');
  const opcoes=Array.from(inputs).map(i=>i.value);
  const ch=$('editOpts').querySelector('input[type=radio]:checked');
  opcoes.push('');renderOptsEdit(opcoes,ch?parseInt(ch.value):0);
};

window.saveNodeEdit=function(){
  const n=flow.nodes[editNodeId];if(!n)return;
  n.pergunta=$('editPergunta').value.trim();
  n.resolucao=$('editResolucao').value.trim();
  n.showResolucao=$('editShowResolucao').checked;

  // Get image from drop zone
  const img=$('dropZone').querySelector('img');
  n.imgData=img?img.src:null;

  if(n.tipo==='multipla_escolha'){
    const inputs=$('editOpts').querySelectorAll('input[type=text]');
    n.opcoes=Array.from(inputs).map(i=>i.value.trim());
    const ch=$('editOpts').querySelector('input[type=radio]:checked');
    n.correta=ch?parseInt(ch.value):0;
  }
  renderNode(n);renderConns();markDirty();closeEditModal();
};

/* ── Drop Zone for images ── */
function setupDropZone(){
  const dz=$('dropZone');
  dz.onclick=()=>$('fileInput').click();
  $('fileInput').onchange=e=>handleFile(e.target.files[0]);
  dz.ondragover=e=>{e.preventDefault();dz.classList.add('drag-over')};
  dz.ondragleave=()=>dz.classList.remove('drag-over');
  dz.ondrop=e=>{e.preventDefault();dz.classList.remove('drag-over');if(e.dataTransfer.files.length)handleFile(e.dataTransfer.files[0])};
}

function handleFile(file){
  if(!file||!file.type.startsWith('image/'))return;
  if(file.size>800*1024){alert('Imagem muito grande! Máximo 800KB. Esta tem '+Math.round(file.size/1024)+'KB.');return}
  const reader=new FileReader();
  reader.onload=e=>{
    $('dropZone').innerHTML=`<img src="${e.target.result}"><br><small>Clique ou arraste para trocar</small><input type="file" id="fileInput" accept="image/*" style="display:none">`;
    setupDropZone();
  };
  reader.readAsDataURL(file);
}

/* ══════════════ COMMENT MODAL ══════════════ */
function openCommentModal(nid){
  editNodeId=nid;
  $('commentText').value=flow.nodes[nid]?.comentario||'';
  $('commentModal').classList.add('show');$('commentText').focus();
}
window.closeCommentModal=()=>$('commentModal').classList.remove('show');
window.saveComment=function(){
  const n=flow.nodes[editNodeId];if(!n)return;
  n.comentario=$('commentText').value.trim()||null;
  renderNode(n);renderConns();markDirty();closeCommentModal();
};

/* ══════════════ SIDEBAR ══════════════ */
function showSB(){$('sidebar').classList.remove('hidden')}
$('btnSidebarToggle').onclick=()=>showSB();
$('btnToggleSB').onclick=()=>$('sidebar').classList.toggle('hidden');
document.querySelectorAll('.sb-tabs button').forEach(b=>b.onclick=()=>{
  sbTab=b.dataset.tab;document.querySelectorAll('.sb-tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');renderSB();
});
$('btnNewFlow').onclick=()=>{$('newFlowName').value='';$('newFlowModal').classList.add('show');$('newFlowName').focus()};
window.closeNewFlowModal=()=>$('newFlowModal').classList.remove('show');
$('newFlowName').onkeydown=e=>{if(e.key==='Enter')createNewFlow()};

window.createNewFlow=async function(){
  const nome=$('newFlowName').value.trim();if(!nome){$('newFlowName').focus();return}
  const id='fl_'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  const sid=uid();
  const data={nome,criadoEm:new Date().toISOString(),atualizadoEm:new Date().toISOString(),nodes:{[sid]:{id:sid,tipo:'inicio',titulo:'Início',x:300,y:300,cor:'#34c759',conexoes:{}}}};
  try{await set(ref(db,'fluxos/'+user.uid+'/'+id),data);closeNewFlowModal();await loadLists();loadFlow(id)}catch(e){console.error(e);alert('Erro.')}
};

/* ══════════════ KEYBOARD ══════════════ */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA')return;
  if((e.key==='Delete'||e.key==='Backspace')&&selNode&&flow.nodes[selNode]?.tipo!=='inicio') deleteNode(selNode);
  if(e.key==='Escape'){
    if($('editModal').classList.contains('show')) closeEditModal();
    else if($('commentModal').classList.contains('show')) closeCommentModal();
    else if($('newFlowModal').classList.contains('show')) closeNewFlowModal();
    else if(isConn){isConn=false;if(tempPath){tempPath.remove();tempPath=null}connFrom=null}
    hideCtx();
  }
});

/* Double click on canvas → add MC */
wrap.addEventListener('dblclick',e=>{
  if(e.target.closest('.node'))return;
  if(!flowId)return;
  const pt=clientToCanvas(e.clientX,e.clientY);
  const id=uid();
  flow.nodes[id]={id,tipo:'multipla_escolha',x:pt.x-100,y:pt.y-30,cor:'#0071e3',conexoes:{},pergunta:'',opcoes:['','','',''],correta:0,resolucao:'',showResolucao:false};
  renderNode(flow.nodes[id]);renderConns();markDirty();openEditModal(id);
});

window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

applyTransform();
</script>
